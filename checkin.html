    .ck-week { text-align: center; font-size: 0.72rem; color: var(--text3); padding: 4px 0; }

    .ck-day.checked { background: var(--gradient); color: var(--accent-ink); font-weight: 700; }
    .ck-day.today { border-color: var(--accent); }
    .ck-day.future { opacity: 0.3; cursor: default; }
    .ck-day.blank { pointer-events: none; }
    .ck-hint { font-size: 0.78rem; color: var(--text3); text-align: center; }
    @media (max-width: 420px) { .ck-grid { gap: 4px; } .ck-day { font-size: 0.82rem; } }

  <div class="jt-toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js?v=15"></script>
  <script>
    (function () {
      'use strict';
      var Auth = window.JTAuth;
      var dates = {};      // 'YYYY-MM-DD' -> true
      var year, month;     // 当前展示的月份
      var today = new Date();
      var todayStr = fmtDate(today);

      function pad(n) { return (n < 10 ? '0' : '') + n; }
      function fmtDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

      function toast(msg, type) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'jt-toast show ' + (type || '');
        setTimeout(function () { t.className = 'jt-toast'; }, 2600);
      }

      // 连续打卡天数：从今天（或昨天，若今天未打）往前数
      function calcStreak() {
        var streak = 0;
        var d = new Date();
        if (!dates[todayStr]) d.setDate(d.getDate() - 1);
        while (dates[fmtDate(d)]) { streak++; d.setDate(d.getDate() - 1); }
        return streak;
      }

      function render() {
        document.getElementById('monthLabel').textContent = year + '年' + (month + 1) + '月';
        var grid = document.getElementById('dayGrid');
        var html = '';
        var first = new Date(year, month, 1).getDay();
        var days = new Date(year, month + 1, 0).getDate();
        for (var i = 0; i < first; i++) html += '<div class="ck-day blank"></div>';
        for (var d = 1; d <= days; d++) {
          var dateObj = new Date(year, month, d);
          var ds = fmtDate(dateObj);
          var cls = 'ck-day';
          if (dates[ds]) cls += ' checked';
          if (ds === todayStr) cls += ' today';
          if (dateObj > today) cls += ' future';
          html += '<div class="' + cls + '" data-date="' + ds + '">' + d + '</div>';
        }
        grid.innerHTML = html;
        document.getElementById('statStreak').textContent = calcStreak();
        document.getElementById('statTotal').textContent = Object.keys(dates).length;
      }

      function load() {
        Auth.fetchCheckins().then(function (list) {
          dates = {};
          (list || []).forEach(function (d) { dates[d] = true; });
          var now = new Date();
          year = now.getFullYear();
          month = now.getMonth();
          render();
        });
      }

      document.getElementById('dayGrid').addEventListener('click', function (e) {
        var cell = e.target.closest('.ck-day');
        if (!cell || cell.classList.contains('blank') || cell.classList.contains('future')) return;
        var date = cell.dataset.date;
        var wasChecked = !!dates[date];
        // 弹簧弹跳反馈（CSS keyframe，贴合弹跳主题）
        cell.classList.remove('ux-pop');
        void cell.offsetWidth; // 重启动画
        cell.classList.add('ux-pop');
        // 乐观切换高亮 + 统计（背景由 CSS 过渡平滑变化，不整格重渲染）
        if (wasChecked) delete dates[date]; else dates[date] = true;
        cell.classList.toggle('checked', !wasChecked);
        document.getElementById('statStreak').textContent = calcStreak();
        document.getElementById('statTotal').textContent = Object.keys(dates).length;
        Auth.toggleCheckin(date).then(function (res) {
          if (res.error) {
            // 失败回滚
            if (wasChecked) dates[date] = true; else delete dates[date];
            cell.classList.toggle('checked', wasChecked);
            document.getElementById('statStreak').textContent = calcStreak();
            document.getElementById('statTotal').textContent = Object.keys(dates).length;
            return toast('操作失败: ' + (res.error.message || ''), 'err');
          }
          toast(wasChecked ? '已取消打卡' : '打卡成功，今天也练了 💪', 'ok');
        });
      });
      document.getElementById('btnPrev').addEventListener('click', function () {
        month--; if (month < 0) { month = 11; year--; }
        render();
      });
      document.getElementById('btnNext').addEventListener('click', function () {
        month++; if (month > 11) { month = 0; year++; }
        render();
      });

      Auth.init(function (session) {
        if (!session) { location.href = 'login.html?next=checkin.html'; return; }
        load();
      });
    })();
  </script>
