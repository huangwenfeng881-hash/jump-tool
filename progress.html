    <div class="pg-hint">💡 说明：原地弹跳=原地起跳/CMJ/SJ/DJ 记录 · 助跑弹跳=助跑起跳记录 · 摸高=在「我的」页记录的摸高成绩。图表按保存时间排序，删除记录后刷新即同步。</div>

  <div class="jt-toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js?v=15"></script>
  <script>
    (function () {
      'use strict';
      var Auth = window.JTAuth;
      // 图表类型 → 弹跳记录 test_type 映射
      var CATS = {
        '原地弹跳': ['原地起跳', '无摆臂CMJ', '有摆臂CMJ', '无摆臂SJ', 'DJ'],
        '助跑弹跳': ['助跑起跳'],
        '摸高': ['摸高']
      };
      var cat = '原地弹跳';
      var chart = null;

      function toast(msg, type) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'jt-toast show ' + (type || '');
        setTimeout(function () { t.className = 'jt-toast'; }, 2600);
      }

      function fmtDay(s) {
        var d = new Date(s);
        if (isNaN(d.getTime())) return s;
        return (d.getMonth() + 1) + '/' + d.getDate();
      }

      function renderChart(list) {
        var empty = document.getElementById('emptyTip');
        var card = document.getElementById('chartCard');
        if (!list.length) {
          card.style.display = 'none';
          empty.style.display = 'block';
          return;
        }
        card.style.display = 'block';
        empty.style.display = 'none';
        // 按时间升序
        list.sort(function (a, b) { return new Date(a.created_at) - new Date(b.created_at); });
        var labels = list.map(function (r) { return fmtDay(r.created_at); });
        var data = list.map(function (r) { return Number(r.height_cm); });
        if (chart) {
          // 复用实例平滑更新，禁止销毁重建（避免闪烁）
          chart.data.labels = labels;
          chart.data.datasets[0].data = data;
          chart.update();
          return;
        }
        chart = new Chart(document.getElementById('chart'), {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: '高度 (cm)',
              data: data,
              borderColor: '#00c6ff',
              backgroundColor: 'rgba(0,198,255,0.12)',
              pointBackgroundColor: '#00c6ff',
              borderWidth: 2,
              tension: 0.3,
              fill: true
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 900, easing: 'easeOutQuart' }, // 线条平滑绘制
            // 悬浮数据点放大弹起 + tooltip 平滑淡入
            transitions: { active: { animation: { duration: 250, easing: 'easeOutQuart' } } },
            elements: { point: { radius: 3, hoverRadius: 8, hoverBorderWidth: 2, hoverBackgroundColor: '#00c6ff', hoverBorderColor: '#fff' } },
            plugins: {
              legend: { display: false },
              tooltip: { backgroundColor: 'rgba(15,23,42,.88)', padding: 10, cornerRadius: 8, displayColors: false, titleColor: '#cbd5e1', bodyColor: '#fff', borderColor: 'rgba(0,198,255,.35)', borderWidth: 1 }
            },
            scales: {
              x: { title: { display: true, text: '训练日期', color: '#6b7484' }, ticks: { color: '#6b7484' } },
              y: { title: { display: true, text: '高度 (cm)', color: '#6b7484' }, ticks: { color: '#6b7484' }, beginAtZero: false }
            }
          }
        });
      }

      function load() {
        Auth.fetchRecords().then(function (res) {
          if (res.error) { toast('加载失败: ' + (res.error.message || ''), 'err'); return; }
          var types = CATS[cat] || [];
          var list = (res.jumps || []).filter(function (r) { return types.indexOf(r.test_type) >= 0; });
          renderChart(list);
        });
      }

      document.getElementById('btnRefresh').addEventListener('click', load);
      document.getElementById('tabs').addEventListener('click', function (e) {
        var btn = e.target.closest('.pg-tab');
        if (!btn) return;
        cat = btn.dataset.cat;
        document.querySelectorAll('.pg-tab').forEach(function (b) { b.classList.toggle('active', b === btn); });
        load();
      });

      // 弹跳页保存记录后自动刷新（跨标签页靠 storage 事件，同页靠切回可见）
      window.addEventListener('storage', function (e) {
        if (e.key === 'vertrise-jump-saved') load();
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) load();
      });

      Auth.init(function (session) {
        if (!session) { location.href = 'login.html?next=progress.html'; return; }
        load();
      });
    })();
  </script>
