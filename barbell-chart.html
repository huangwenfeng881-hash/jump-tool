    <div class="bc-hint">💡 说明：每条记录取「峰值速度」与「负重」。一般规律：负重越大，速度越低——如果某个重量下速度明显偏低，说明该重量偏重、神经疲劳或技术不到位。</div>

  <div class="jt-toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js?v=15"></script>
  <script>
    (function () {
      'use strict';
      var Auth = window.JTAuth;
      var chart = null; // 复用单例，平滑更新不闪烁

      function toast(msg, type) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'jt-toast show ' + (type || '');
        setTimeout(function () { t.className = 'jt-toast'; }, 2600);
      }

      function fmtDay(s) {
        var d = new Date(s);
        if (isNaN(d.getTime())) return s;
        return (d.getMonth() + 1) + '/' + d.getDate();
      }

      function renderChart(list) {
        var empty = document.getElementById('emptyTip');
        var card = document.getElementById('chartCard');
        if (!list.length) { card.style.display = 'none'; empty.style.display = 'block'; return; }
        card.style.display = 'block';
        empty.style.display = 'none';
        list.sort(function (a, b) { return new Date(a.created_at) - new Date(b.created_at); });
        var labels = list.map(function (r) { return fmtDay(r.created_at); });
        var speed = list.map(function (r) { return Number(r.peak_speed); });
        var weight = list.map(function (r) { return (r.weight === null || r.weight === undefined) ? 0 : Number(r.weight); });
        if (chart) {
          chart.data.labels = labels;
          chart.data.datasets[0].data = speed;
          chart.data.datasets[1].data = weight;
          chart.update(); // 平滑更新，不重建
          return;
        }
        chart = new Chart(document.getElementById('chart'), {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              { label: '峰值速度 (m/s)', data: speed, borderColor: '#00c6ff', backgroundColor: 'rgba(0,198,255,.1)', pointBackgroundColor: '#00c6ff', borderWidth: 2, tension: 0.3, fill: true, yAxisID: 'y' },
              { label: '负重 (kg)', data: weight, borderColor: '#ffb347', backgroundColor: 'rgba(255,179,71,.08)', pointBackgroundColor: '#ffb347', borderWidth: 2, tension: 0.3, fill: false, yAxisID: 'y1' }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 900, easing: 'easeOutQuart' },
            transitions: { active: { animation: { duration: 250 } } },
            elements: { point: { radius: 3, hoverRadius: 8, hoverBorderWidth: 2 } },
            plugins: {
              legend: { labels: { color: '#9aa3b2', usePointStyle: true, boxWidth: 8 } },
              tooltip: { backgroundColor: 'rgba(15,23,42,.88)', padding: 10, cornerRadius: 8, displayColors: true }
            },
            scales: {
              x: { title: { display: true, text: '训练日期', color: '#6b7484' }, ticks: { color: '#6b7484' } },
              y: { type: 'linear', position: 'left', title: { display: true, text: '速度 (m/s)', color: '#00c6ff' }, ticks: { color: '#6b7484' } },
              y1: { type: 'linear', position: 'right', title: { display: true, text: '负重 (kg)', color: '#ffb347' }, ticks: { color: '#6b7484' }, grid: { display: false } }
            }
          }
        });
      }

      function load() {
        Auth.fetchRecords().then(function (res) {
          if (res.error) { toast('加载失败: ' + (res.error.message || ''), 'err'); return; }
          renderChart(res.barbells || []);
        });
      }

      document.getElementById('btnRefresh').addEventListener('click', load);
      window.addEventListener('storage', function (e) { if (e.key === 'vertrise-barbell-saved') load(); });
      document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });

      Auth.init(function (session) {
        if (!session) { location.href = 'login.html?next=barbell-chart.html'; return; }
        load();
      });
    })();
  </script>
