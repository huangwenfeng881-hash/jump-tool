  <style>
    body { display: flex; flex-direction: column; align-items: center; }
    .jt-nav { width: 100%; }
    .tr-wrap { width: 100%; max-width: 860px; margin: 0 auto; padding: 24px 20px 48px; display: flex; flex-direction: column; gap: 14px; }
    .tr-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .tr-head h1 { font-size: 1.5rem; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .tr-sub { color: var(--text2); font-size: 0.85rem; }
    .tr-quota { font-size: 0.78rem; padding: 5px 12px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--border); color: var(--text2); white-space: nowrap; }
    .chat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; height: calc(100vh - 240px); min-height: 460px; }
    .chat-msgs { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 82%; padding: 12px 16px; border-radius: 16px; font-size: 0.92rem; line-height: 1.7; white-space: pre-wrap; word-break: break-word; opacity: 0; transform: translateY(14px); animation: msg-in .35s cubic-bezier(.22,1,.36,1) forwards; }
    .msg.ai { align-self: flex-start; background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.user { align-self: flex-end; background: var(--gradient); color: var(--accent-ink); border-bottom-right-radius: 4px; }
    .msg.err { align-self: flex-start; border-color: rgba(255,77,106,.4); color: var(--danger); background: rgba(255,77,106,.06); }
    @keyframes msg-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .typing { display: inline-flex; gap: 5px; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .2s; }
    .typing i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    .chat-quick { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--border); }
    .chat-input { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); }
    .chat-input textarea { flex: 1; resize: none; min-height: 46px; max-height: 130px; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.92rem; font-family: inherit; outline: none; }
    .chat-input textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,198,255,.15); }
    .chat-hint { font-size: 0.74rem; color: var(--text3); padding: 0 16px 10px; }
    @media (max-width: 600px) { .msg { max-width: 92%; } .chat-card { height: calc(100vh - 200px); } }

        <h1>🤖 AI 弹跳教练</h1>

      <div class="chat-input">
        <textarea id="chatInput" placeholder="问教练：我的弹跳瓶颈是什么？&#10;（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="jt-btn jt-btn-accent" id="chatSend">发送</button>
      </div>
      <div class="chat-hint">🔒 隐私说明：对话只提交你的文字与训练数据，不上传视频/图片。免费用户每日有限次数，会员无限。</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>

  <script>
    (function () {
      'use strict';
      var Auth = window.JTAuth;
      var FREE_DAILY = 5;                 // 免费用户每日对话次数（前端限制，后端付费后续再补）
      var QUOTA_KEY = 'vt-chat-quota';
      var history = [];                   // 发给 API 的多轮消息
      var userCtx = '';                   // 用户真实数据上下文
      var isVip = false;
      var busy = false;
      var maxJumpH = 0;
      var msgsEl = document.getElementById('chatMsgs');
      var inputEl = document.getElementById('chatInput');
      var sendBtn = document.getElementById('chatSend');
      var quotaEl = document.getElementById('chatQuota');

      function toast(msg, type) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'jt-toast show ' + (type || '');
        setTimeout(function () { t.className = 'jt-toast'; }, 2600);
      }

      // ---------- 每日次数（前端限制；VIP 无限） ----------
      function quotaInfo() {
        if (isVip) return { unlimited: true, used: 0 };
        var now = new Date();
        var day = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
        var q = null;
        try { q = JSON.parse(localStorage.getItem(QUOTA_KEY) || 'null'); } catch (e) {}
        if (!q || q.d !== day) q = { d: day, used: 0 };
        return { unlimited: false, used: q.used, day: day };
      }
      function saveQuota(used) {
        var q = quotaInfo();
        q.used = used;
        try { localStorage.setItem(QUOTA_KEY, JSON.stringify(q)); } catch (e) {}
      }
      function renderQuota() {
        var q = quotaInfo();
        quotaEl.textContent = q.unlimited ? '💎 会员无限对话' : ('今日剩余 ' + Math.max(0, FREE_DAILY - q.used) + ' 次');
      }

      // ---------- 汇总用户真实数据作为 AI 上下文 ----------
      function buildContext() {
        return Promise.all([
          Auth.getProfile(),
          Auth.fetchRecords(),
          Auth.fetchCheckins(),
          Auth.getAiStatus()
        ]).then(function (r) {
          var p = r[0], recs = r[1] || {}, checkins = r[2] || [], st = r[3] || null;
          isVip = !!(st && st.is_vip) || Auth.getPlan() === 'pro';
          var lines = [];
          if (p) {
            var parts = [];
            if (p.height_cm) parts.push('身高' + p.height_cm + 'cm');
            if (p.reach_cm) parts.push('站立摸高' + p.reach_cm + 'cm');
            if (p.weight_kg) parts.push('体重' + p.weight_kg + 'kg');
            if (p.wingspan_cm) parts.push('臂展' + p.wingspan_cm + 'cm');
            if (parts.length) lines.push('个人资料：' + parts.join('，'));
          }
          var jumps = recs.jumps || [];
          if (jumps.length) {
            lines.push('近期弹跳记录（最新' + Math.min(10, jumps.length) + '条）：');
            jumps.slice(0, 10).forEach(function (j) {
              var h = Number(j.height_cm) || 0;
              if (h > maxJumpH) maxJumpH = h;
              lines.push('  · ' + (j.test_type || '助跑起跳') + ' ' + j.height_cm + 'cm 腾空' + j.flight_time + 's' + (j.created_at ? '（' + new Date(j.created_at).toLocaleDateString() + '）' : ''));
            });
          }
          var bars = recs.barbells || [];
          if (bars.length) {
            lines.push('杠铃测速（最新' + Math.min(10, bars.length) + '条）：');
            bars.slice(0, 10).forEach(function (b) {
              lines.push('  · 峰值速度 ' + b.peak_speed + 'm/s' + (b.weight != null ? ' @' + b.weight + 'kg' : '') + (b.created_at ? '（' + new Date(b.created_at).toLocaleDateString() + '）' : ''));
            });
          }
          if (checkins.length) lines.push('训练打卡：累计 ' + checkins.length + ' 天');
          userCtx = lines.length ? lines.join('\n') : '（用户暂未填写资料或记录）';
          renderQuota();
        });
      }

      function systemPrompt() {
        return '你是 Vertrise跃升 的 AI 弹跳教练（资深弹跳/力量/体能训练专家）。结合用户真实训练数据，用中文给出专业、简洁、可执行的回答。\n' +
          '【用户真实数据】\n' + userCtx + '\n' +
          '规则：\n' +
          '1. 只基于上面的数据作答，不虚构用户没有的记录；数据不足时明确说明；\n' +
          '2. 涉及训练计划时，按天列出动作名称、组数×次数、休息时间、动作要点；\n' +
          '3. 注意安全，有伤病风险的动作给出替代方案；\n' +
          '4. 回答精炼，避免冗长空话。';
      }

      // ---------- 消息渲染（滑入淡入） ----------
      function addMsg(role, text, cls) {
        var d = document.createElement('div');
        d.className = 'msg ' + role + (cls ? ' ' + cls : '');
        d.textContent = text;
        msgsEl.appendChild(d);
        msgsEl.scrollTop = msgsEl.scrollHeight;
        return d;
      }
      function addTyping() {
        var d = document.createElement('div');
        d.className = 'msg ai';
        d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
        msgsEl.appendChild(d);
        msgsEl.scrollTop = msgsEl.scrollHeight;
        return d;
      }

      function friendlyErr(r) {
        var m = (r && r.msg) || '请求失败，请稍后重试';
        if (/网络|CORS|fetch|Failed/i.test(m)) m = '网络异常，无法连接 AI 服务，请检查网络后重试';
        if (/未配置/i.test(m)) m = 'AI 服务未配置，请先在 js/supabase-config.js 配置 GLM';
        return m;
      }

      // 本地模板兜底（GLM 未配置时，「一键生成训练计划」仍可用）
      function planToText(plan) {
        var t = '【' + plan.title + '】\n🎯 ' + plan.goal + '\n📋 ' + plan.summary + '\n\n';
        plan.schedule.forEach(function (d) {
          t += '■ 第' + d.day + '天 · ' + d.title + '\n';
          d.exercises.forEach(function (x) {
            t += '  · ' + x.name + '　' + x.sets + '×' + x.reps + ' · 休息' + x.rest + '\n';
          });
        });
        t += '\n📈 进阶规则：' + plan.progression;
        if (plan.cautions && plan.cautions.length) t += '\n⚠️ 注意事项：' + plan.cautions.join('；');
        return t;
      }
      function fallbackPlan() {
        var plan = window.JTRAINER.generate({
          currentHeight: maxJumpH || 50, goalHeight: 0, age: 25,
          level: 'intermediate', days: 3, equipment: ['none'], injury: 'none'
        });
        return planToText(plan);
      }

      // ---------- 发送 ----------
      function send(text) {
        text = (text || '').trim();
        if (!text || busy) return;
        busy = true;
        sendBtn.disabled = true;

        var q = quotaInfo();
        if (!q.unlimited && q.used >= FREE_DAILY) {
          addMsg('ai', '今日免费对话次数已用完。\n可前往「会员」购买/兑换解锁无限对话，或到「计划」页使用免费训练模板。', 'err');
          busy = false; sendBtn.disabled = false; return;
        }

        // GLM 未配置：一键生成计划用本地模板兜底，其余给提示
        if (!window.GLM || !window.GLM.isConfigured()) {
          if (/计划|生成/.test(text)) {
            addMsg('user', text);
            addMsg('ai', fallbackPlan());
          } else {
            addMsg('user', text);
            addMsg('ai', 'AI 服务未配置（js/supabase-config.js → GLM_API_KEY），暂时无法对话。可到「计划」页使用免费训练模板。', 'err');
          }
          busy = false; sendBtn.disabled = false; return;
        }

        addMsg('user', text);
        history.push({ role: 'user', content: text });
        var typing = addTyping();
        var messages = [{ role: 'system', content: systemPrompt() }].concat(history.slice(-12));

        var streamed = '';
        window.GLM.chat(messages, {
          temperature: 0.6, stream: true,
          onChunk: function (c) {
            streamed += c;
            typing.textContent = streamed;
            msgsEl.scrollTop = msgsEl.scrollHeight;
          }
        }).then(function (r) {
          if (r.ok && r.text) {
            history.push({ role: 'assistant', content: r.text });
            saveQuota(q.used + 1);
          } else {
            typing.className = 'msg ai err';
            typing.textContent = friendlyErr(r);
          }
          renderQuota();
          busy = false; sendBtn.disabled = false;
        }).catch(function (e) {
          typing.className = 'msg ai err';
          typing.textContent = '出错了：' + (e && e.message ? e.message : '网络异常，请稍后重试');
          busy = false; sendBtn.disabled = false;
        });
      }

      // ---------- 快捷按钮 ----------
      var QUICK = [
        { label: '⚡ 一键生成训练计划', prompt: '请根据我的数据，生成一份四周弹跳提升训练计划（按天列出动作、组数×次数、休息、要点）。' },
        { label: '📈 分析我的弹跳瓶颈', prompt: '请结合我的弹跳记录，分析我的弹跳瓶颈在哪里，并给出针对性训练建议。' },
        { label: '💪 力量与弹跳关系', prompt: '请结合我的杠铃测速数据，分析我的力量水平与弹跳表现的关系，指出需要加强的力量项。' },
        { label: '🔄 调整我的计划', prompt: '请根据我的训练打卡与近期数据，帮我调整训练计划（指出哪里该加量/减量）。' }
      ];
      var quickBox = document.getElementById('chatQuick');
      QUICK.forEach(function (item) {
        var b = document.createElement('button');
        b.className = 'jt-btn jt-btn-ghost jt-btn-sm';
        b.textContent = item.label;
        b.addEventListener('click', function () { send(item.prompt); });
        quickBox.appendChild(b);
      });

      sendBtn.addEventListener('click', function () { send(inputEl.value); inputEl.value = ''; });
      inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send(inputEl.value);
          inputEl.value = '';
        }
      });

      // ---------- 初始化 ----------
      Auth.init(function (session) {
        if (!session) { location.href = 'login.html?next=trainer.html'; return; }
        buildContext().then(function () {
          addMsg('ai', '你好，我是你的 AI 弹跳教练 🤖\n已自动读取你的训练数据（身高/摸高/弹跳记录/杠铃数据/打卡情况）。\n可以直接提问，或点下方快捷按钮。');
          inputEl.focus();
        });
      });
    })();
  </script>
