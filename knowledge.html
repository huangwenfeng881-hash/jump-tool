<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>弹跳知识科普 · Vertrise跃升</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ux.css?v=15">
  <script>(function(){var q=location.search.match(/theme=([^&]*)/);var t=q?q[1]:'';if(t!=='dark'){try{t=localStorage.getItem('vertrise-theme')||'light';}catch(e){t='light';}if(t!=='dark')t='light';}document.documentElement.setAttribute('data-theme',t);})();</script>
  <style>
    body { display:flex; flex-direction:column; align-items:center; }
    .kv-wrap { width:100%; max-width:760px; margin:0 auto; padding:20px 16px 70px; display:flex; flex-direction:column; gap:14px; }
    .kv-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .kv-head h1 { font-size:1.45rem; font-weight:800; background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .kv-sub { color:var(--text2); font-size:.83rem; margin-top:4px; }
    .kv-tip { font-size:.78rem; color:var(--text2); background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:10px 12px; line-height:1.6; }
    .kv-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .kv-search { flex:1; min-width:160px; }
    .kv-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
    .kv-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; cursor:pointer; transition:transform .15s, box-shadow .15s; }
    .kv-card:active { transform:scale(.99); }
    .kv-cover { width:100%; aspect-ratio:16/9; object-fit:cover; background:#0c1220; display:block; }
    .kv-cover.placeholder { display:flex; align-items:center; justify-content:center; font-size:34px; color:var(--text2); }
    .kv-body { padding:10px 12px 12px; }
    .kv-title { font-size:.92rem; font-weight:700; line-height:1.35; }
    .kv-meta { font-size:.74rem; color:var(--text2); margin-top:5px; }
    .kv-empty { text-align:center; padding:54px 16px; color:var(--text2); font-size:.88rem; }
    .kv-empty .big { font-size:40px; margin-bottom:10px; }
    .kv-modal { position:fixed; inset:0; background:rgba(0,0,0,.62); display:none; align-items:center; justify-content:center; z-index:70; padding:16px; }
    .kv-modal.show { display:flex; }
    .kv-sheet { width:100%; max-width:560px; background:var(--surface); border-radius:18px; overflow:hidden; max-height:92vh; display:flex; flex-direction:column; }
    .kv-sheet video { width:100%; max-height:56vh; background:#000; }
    .kv-sheet .inner { padding:14px 16px 16px; overflow:auto; }
    .kv-sheet h3 { font-size:1rem; line-height:1.4; }
    .kv-sheet .note { font-size:.84rem; color:var(--text2); line-height:1.7; margin-top:8px; white-space:pre-wrap; }
    .kv-sheet .act { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    .kv-prog { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:80; }
    .kv-prog.show { display:flex; }
    .kv-prog .box { width:280px; background:var(--surface); border-radius:16px; padding:20px; text-align:center; }
    .kv-prog .bar { height:8px; border-radius:999px; background:var(--surface2); overflow:hidden; margin-top:12px; }
    .kv-prog .bar i { display:block; height:100%; width:0; background:var(--gradient); transition:width .2s; }
    .kv-field { margin-top:10px; }
    .kv-field label { font-size:.8rem; color:var(--text2); display:block; margin-bottom:5px; }
    .toast { position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px); background:#111; color:#fff; padding:10px 18px; border-radius:999px; font-size:.85rem; opacity:0; transition:.25s; pointer-events:none; z-index:99; }
    .toast.show { opacity:1; transform:translateX(-50%); }
  </style>
</head>
<body>
<nav class="jt-nav">
  <a class="jt-nav-logo" href="index.html">
    <img src="img/favicon.png" alt="Vertrise跃升">
    <span>Vertrise跃升</span>
  </a>
  <div class="jt-nav-links">
    <a class="jt-nav-link" href="index.html">首页</a>
    <a class="jt-nav-link" href="profile-setup.html">信息评估</a>
    <a class="jt-nav-link" href="workout.html">一周训练</a>
    <a class="jt-nav-link active" href="knowledge.html">弹跳知识</a>
    <a class="jt-nav-link" href="jump.html">弹跳测量</a>
  </div>
  <div class="jt-nav-user">
    <button class="theme-toggle" id="themeToggle" aria-label="切换深浅色">🌓</button>
    <span class="user-name" id="navUserName">未登录</span>
  </div>
</nav>

<div class="kv-wrap">
  <div class="kv-head">
    <div>
      <h1>🎬 弹跳知识科普</h1>
      <div class="kv-sub">公开视频 · 所有人可见 · 我和签约创作者上传</div>
    </div>
    <div class="kv-bar">
      <input class="jt-input kv-search" id="kvSearch" type="search" placeholder="搜索标题…">
      <button class="jt-btn jt-btn-accent jt-btn-sm" id="kvUploadBtn">⬆️ 上传视频</button>
    </div>
  </div>

  <div class="kv-tip" id="kvTip">正在加载…</div>

  <div class="kv-grid" id="kvGrid"></div>

  <div class="kv-empty" id="kvEmpty" style="display:none">
    <div class="big">🎬</div>
    <div>还没有公开视频</div>
    <div style="margin-top:6px;font-size:.8rem">登录后点右上角「上传视频」，发布后所有人都能看到</div>
  </div>
</div>

<div class="kv-modal" id="kvPlayer">
  <div class="kv-sheet">
    <video id="kvVideo" controls playsinline></video>
    <div class="inner">
      <h3 id="kvTitle">—</h3>
      <div class="kv-meta" id="kvMeta" style="font-size:.76rem;color:var(--text2);margin-top:6px"></div>
      <div class="note" id="kvNote"></div>
      <div class="act" id="kvOwnerAct" style="display:none">
        <button class="jt-btn jt-btn-ghost jt-btn-sm" id="kvEditBtn">编辑</button>
        <button class="jt-btn jt-btn-ghost jt-btn-sm" id="kvDelBtn" style="color:#e5534b">删除</button>
      </div>
      <div class="act">
        <button class="jt-btn jt-btn-ghost jt-btn-sm" id="kvCloseBtn">关闭</button>
      </div>
    </div>
  </div>
</div>

<div class="kv-modal" id="kvEdit">
  <div class="kv-sheet">
    <div class="inner">
      <h3>编辑信息</h3>
      <div class="kv-field"><label>标题</label><input class="jt-input" id="kvEditTitle" maxlength="60"></div>
      <div class="kv-field"><label>简介</label><textarea class="jt-input" id="kvEditNote" rows="4" maxlength="400"></textarea></div>
      <div class="act">
        <button class="jt-btn jt-btn-sm" id="kvEditSave">保存</button>
        <button class="jt-btn jt-btn-ghost jt-btn-sm" id="kvEditCancel">取消</button>
      </div>
    </div>
  </div>
</div>

<div class="kv-prog" id="kvProg">
  <div class="box">
    <div style="font-size:.9rem" id="kvProgText">正在上传…</div>
    <div class="bar"><i id="kvProgBar"></i></div>
  </div>
</div>

<input type="file" id="kvFile" accept="video/*" style="display:none">
<div class="toast" id="toast"></div>

<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js?v=20261121"></script>
<script src="js/auth.js?v=20261121"></script>
<script src="js/knowledge.js?v=20261121"></script>
<script src="js/ui.js?v=15"></script>
<script>
(function () {
  'use strict';
  var K = window.JTKnowledge;
  var rows = [];
  var me = null;
  var current = null;
  var editing = null;

  function $(id) { return document.getElementById(id); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2200); }
  function fmtDate(s) { var d = new Date(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  function fmtSize(n) { if (!n) return ''; return (n / 1048576).toFixed(1) + 'MB'; }
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  function load() {
    $('kvTip').textContent = '正在加载视频…';
    return K.list().then(function (list) {
      rows = list || [];
      render();
      $('kvTip').textContent = rows.length
        ? ('公开视频 ' + rows.length + ' 条 · 所有人可见' + (me ? '' : ' · 上传需登录'))
        : '还没有视频，登录后上传第一条';
    }).catch(function (err) {
      $('kvTip').textContent = '加载失败：' + (err.message || '网络异常');
      $('kvEmpty').style.display = 'block';
      $('kvEmpty').querySelector('div:nth-child(2)').textContent = '视频加载失败，检查网络后重试';
    });
  }

  function render() {
    var q = ($('kvSearch').value || '').trim().toLowerCase();
    var list = rows.filter(function (r) { return !q || String(r.title || '').toLowerCase().indexOf(q) >= 0; });
    var grid = $('kvGrid');
    grid.innerHTML = '';
    $('kvEmpty').style.display = list.length ? 'none' : 'block';
    list.forEach(function (r) {
      var card = document.createElement('div');
      card.className = 'kv-card';
      var cover = r.cover_path
        ? '<img class="kv-cover" loading="lazy" src="' + K.publicUrl(r.cover_path) + '" alt="">'
        : '<div class="kv-cover placeholder">🎬</div>';
      card.innerHTML = cover +
        '<div class="kv-body">' +
          '<div class="kv-title">' + esc(r.title) + '</div>' +
          '<div class="kv-meta">' + esc(r.creator_name || '创作者') + ' · ' + fmtDate(r.created_at) +
            (r.size_bytes ? ' · ' + fmtSize(r.size_bytes) : '') + '</div>' +
        '</div>';
      card.addEventListener('click', function () { openPlayer(r); });
      grid.appendChild(card);
    });
  }

  function openPlayer(r) {
    current = r;
    $('kvVideo').src = K.publicUrl(r.video_path);
    $('kvTitle').textContent = r.title || '';
    $('kvMeta').textContent = (r.creator_name || '创作者') + ' · ' + fmtDate(r.created_at);
    $('kvNote').textContent = r.note || '';
    $('kvOwnerAct').style.display = (me && r.user_id === me.id) ? 'flex' : 'none';
    $('kvPlayer').classList.add('show');
    var v = $('kvVideo');
    try { v.play().catch(function () {}); } catch (e) {}
  }

  function closePlayer() {
    $('kvPlayer').classList.remove('show');
    var v = $('kvVideo');
    try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
  }

  $('kvCloseBtn').addEventListener('click', closePlayer);
  $('kvPlayer').addEventListener('click', function (e) { if (e.target === $('kvPlayer')) closePlayer(); });
  $('kvSearch').addEventListener('input', render);

  $('kvUploadBtn').addEventListener('click', function () {
    if (!me) {
      toast('请先登录后再上传');
      setTimeout(function () { location.href = 'login.html?next=knowledge.html'; }, 900);
      return;
    }
    $('kvFile').click();
  });

  $('kvFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (!f) return;
    var title = prompt('给这条视频起个标题（公开可见）', f.name.replace(/\.[^.]+$/, ''));
    if (title === null) return;
    var note = prompt('一句话简介（可留空）', '') || '';
    $('kvProg').classList.add('show');
    $('kvProgText').textContent = '正在上传 0%';
    $('kvProgBar').style.width = '0%';
    K.upload(f, { title: title || '未命名', note: note }, function (p) {
      var pct = Math.round(p * 100);
      $('kvProgText').textContent = '正在上传 ' + pct + '%';
      $('kvProgBar').style.width = pct + '%';
    }).then(function () {
      $('kvProg').classList.remove('show');
      toast('已发布，所有人都能看到');
      load();
    }).catch(function (err) {
      $('kvProg').classList.remove('show');
      toast(err.message || '上传失败');
      if (err.needLogin) setTimeout(function () { location.href = 'login.html?next=knowledge.html'; }, 900);
    });
  });

  $('kvEditBtn').addEventListener('click', function () {
    if (!current) return;
    editing = current;
    $('kvEditTitle').value = current.title || '';
    $('kvEditNote').value = current.note || '';
    $('kvEdit').classList.add('show');
  });
  $('kvEditCancel').addEventListener('click', function () { $('kvEdit').classList.remove('show'); });
  $('kvEditSave').addEventListener('click', function () {
    if (!editing) return;
    K.update(editing.id, { title: $('kvEditTitle').value.trim() || '未命名', note: $('kvEditNote').value.trim() })
      .then(function () {
        $('kvEdit').classList.remove('show');
        toast('已保存');
        load();
      })
      .catch(function (e) { toast(e.message || '保存失败'); });
  });

  $('kvDelBtn').addEventListener('click', function () {
    if (!current) return;
    if (!confirm('删除这条视频？删除后所有人都不再可见。')) return;
    K.remove(current).then(function () {
      closePlayer();
      toast('已删除');
      load();
    }).catch(function (e) { toast(e.message || '删除失败'); });
  });

  // 初始化
  if (window.JTAuth) {
    JTAuth.init(function (s) {
      me = s && s.user ? s.user : null;
      var n = $('navUserName');
      if (n) n.textContent = me ? (me.email || '已登录') : '未登录';
      load();
    });
  } else {
    load();
  }
})();
</script>
</body>
</html>
