<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>synthetic-test</title></head>
<body>
<script src="js/pose.js"></script>
<script>
window.__log = [];
function log(m) { window.__log.push(String(m)); }
window.onerror = function (msg, src, line) { log('onerror: ' + msg + ' @' + (src || '') + ':' + line); };

// 生成 pose 数据条目（与 js/pose.js 的 entryOf 字段一致）
function entry(t, o) {
  return {
    t: t,
    kneeL: o.kneeL, kneeR: o.kneeR, hipL: o.hipL, hipR: o.hipR,
    comH: o.comH, comX: 0.5,
    feetY: o.feetY, leftFeetY: o.leftFeetY, rightFeetY: o.rightFeetY,
    hipX: 0.5, hipY: 1 - o.comH / 100, ankleX: 0.5, ankleY: o.feetY,
    shX: 0.5, shY: 1 - (o.comH + 15) / 100, wrX: 0.5, wrY: 1 - (o.comH + 25) / 100,
    lost: false
  };
}
function lerp(a, b, k) { return a + (b - a) * k; }
function smooth(t, a, b, k) { return lerp(a, b, Math.min(1, Math.max(0, k))); }

// 生成 91 帧（30fps）双脚起跳序列。起跳区（44-56）与下落落地区（72-81）按 test.mp4 实测值
// 硬编码（临界区 1 帧偏差就会翻转阈值决策：髋部最低点必须在帧50、起跳在帧52、重新触地 0.780@47）。
function genDouble() {
  var data = [];
  var fps = 30, N = 91;
  // 起跳区实测（i: feetY, comH, kneeL, kneeR）
  var TAKE = {
    44: [0.762, 32.6, 127, 158], 45: [0.766, 31.8, 145, 144], 46: [0.773, 31.2, 165, 143],
    47: [0.780, 30.7, 170, 148], 48: [0.786, 30.3, 169, 143], 49: [0.792, 30.2, 170, 138],
    50: [0.796, 30.1, 175, 130], 51: [0.801, 31.6, 179, 132], 52: [0.803, 33.4, 179, 136],
    53: [0.803, 34.4, 179, 137], 54: [0.797, 36.8, 178, 139], 55: [0.779, 38.6, 176, 139],
    56: [0.775, 39.5, 178, 138]
  };
  var DESC = { // 下落落地区实测（i: feetY, comH）
    72: [0.644, 48.7], 73: [0.656, 47.9], 74: [0.658, 47.6], 75: [0.666, 46.4],
    76: [0.679, 45.3], 77: [0.685, 44.8], 78: [0.697, 43.1], 79: [0.707, 41.6],
    80: [0.715, 40.7], 81: [0.716, 39.8]
  };
  for (var i = 0; i < N; i++) {
    var t = i / fps;
    var feetY, comH, kl, kr, lf, rf;
    if (TAKE[i]) {
      feetY = TAKE[i][0]; comH = TAKE[i][1]; kl = TAKE[i][2]; kr = TAKE[i][3]; lf = rf = feetY;
    } else if (DESC[i]) {
      feetY = DESC[i][0]; comH = DESC[i][1]; kl = 177; kr = 176; lf = rf = feetY;
    } else if (i <= 15) { // 站立
      feetY = 0.865; comH = 24.5; kl = 168; kr = 172; lf = rf = 0.865;
    } else if (i <= 36) { // 助跑（脚在地面，轻微起伏）
      var run = (i - 16) / 20;
      feetY = 0.80 + 0.02 * Math.sin(run * Math.PI * 4);
      comH = lerp(28, 33, run); kl = 160; kr = 160; lf = rf = feetY;
    } else if (i <= 43) { // 倒数第二步深蹲（脚背踮起，脚部信号略高；膝角最深处=帧43=89°）
      var dip = (i - 37) / 6;
      kl = lerp(113, 89, dip); kr = lerp(140, 162, dip);
      feetY = lerp(0.80, 0.755, Math.min(1, dip * 1.1));
      comH = lerp(35.5, 33.3, dip);
      lf = rf = feetY;
    } else if (i <= 62) { // 起跳上升（脚离地，57-62）
      var up = (i - 57) / 5;
      feetY = lerp(0.711, 0.667, up);
      comH = lerp(41.4, 47.7, up);
      kl = 178; kr = 150; lf = rf = feetY;
    } else if (i <= 71) { // 顶点附近
      var apex = (i - 63) / 8;
      feetY = lerp(0.621, 0.634, apex);
      comH = lerp(48.5, 49.3, apex) + 0.9 * Math.sin(apex * Math.PI);
      kl = 175; kr = 170; lf = rf = feetY;
    } else { // 落地缓冲深蹲（82-90）
      var sq = (i - 82) / 8;
      feetY = lerp(0.72, 0.742, sq);
      comH = lerp(39.4, 32.2, sq);
      kl = lerp(120, 60, sq); kr = lerp(140, 120, sq);
      lf = rf = feetY;
    }
    data.push(entry(t, { feetY: feetY, comH: Math.round(comH * 10) / 10, kneeL: Math.round(kl), kneeR: Math.round(kr), leftFeetY: Math.round(lf * 1000) / 1000, rightFeetY: Math.round(rf * 1000) / 1000 }));
  }
  return data;
}

// 单脚起跳：与双脚相同，但 47-51 摆动腿（左）抬起
function genSingle() {
  var data = genDouble();
  for (var i = 0; i < data.length; i++) {
    if (i >= 47 && i <= 51) {
      data[i].leftFeetY = Math.round(lerp(0.70, 0.74, (i - 47) / 4) * 1000) / 1000;
      data[i].feetY = data[i].rightFeetY; // 最低点 = 蹬地脚
    }
  }
  return data;
}

// 并步起跳：倒数第二步后双脚并拢再跳（47-50 小跳腾空，51 双脚并拢触地，53 起跳）
function genStepClose() {
  var data = [];
  var fps = 30, N = 91;
  for (var i = 0; i < N; i++) {
    var t = i / fps;
    var feetY, comH, kl, kr;
    if (i <= 15) { feetY = 0.865; comH = 24.5; kl = 168; kr = 172; }
    else if (i <= 36) { var run = (i - 16) / 20; feetY = 0.80 + 0.02 * Math.sin(run * Math.PI * 4); comH = lerp(28, 33, run); kl = 160; kr = 160; }
    else if (i <= 46) { var dip = (i - 37) / 9; kl = lerp(113, 95, dip); kr = lerp(140, 150, dip); feetY = lerp(0.80, 0.76, Math.min(1, dip * 1.2)); comH = lerp(35.5, 31.0, dip); }
    else if (i <= 49) { // 并步小跳（脚离地）
      var hop = (i - 46) / 3;
      feetY = lerp(0.76, 0.72, hop); kl = 120; kr = 130; comH = lerp(31.0, 33.0, hop);
    }
    else if (i <= 51) { // 双脚并拢触地（50-51）
      var pl = (i - 50) / 1;
      feetY = lerp(0.72, 0.80, pl); kl = 140; kr = 140; comH = lerp(33.0, 31.6, pl);
    }
    else if (i <= 56) { var lag = (i - 52) / 4; feetY = lerp(0.803, 0.775, lag); comH = lerp(33.4, 39.5, lag); kl = 178; kr = 150; }
    else if (i <= 62) { var up = (i - 57) / 5; feetY = lerp(0.71, 0.667, up); comH = lerp(41.0, 47.5, up); kl = 178; kr = 150; }
    else if (i <= 71) { var apex = (i - 63) / 8; feetY = lerp(0.621, 0.634, apex); comH = lerp(48.5, 49.3, apex) + 0.9 * Math.sin(apex * Math.PI); kl = 175; kr = 170; }
    else if (i <= 81) { var dn = 1 - Math.pow(1 - (i - 72) / 9, 2); feetY = lerp(0.644, 0.716, dn); comH = lerp(48.7, 39.8, dn); kl = 177; kr = 176; }
    else { var sq = (i - 82) / 8; feetY = lerp(0.72, 0.742, sq); comH = lerp(39.4, 32.2, sq); kl = lerp(120, 60, sq); kr = lerp(140, 120, sq); }
    data.push(entry(t, { feetY: feetY, comH: Math.round(comH * 10) / 10, kneeL: Math.round(kl), kneeR: Math.round(kr), leftFeetY: Math.round(feetY * 1000) / 1000, rightFeetY: Math.round(feetY * 1000) / 1000 }));
  }
  return data;
}

// 纯跑动（无起跳）：脚部持续起伏，髋部平稳
function genRun() {
  var data = [];
  var fps = 30, N = 91;
  for (var i = 0; i < N; i++) {
    var t = i / fps;
    var stride = i / 6;
    var feetY = 0.78 + 0.045 * Math.sin(stride * Math.PI * 2);
    var comH = 31 + 1.2 * Math.sin(stride * Math.PI * 2 + 1);
    var kl = 150 + 20 * Math.sin(stride * Math.PI * 2);
    data.push(entry(t, { feetY: feetY, comH: Math.round(comH * 10) / 10, kneeL: Math.round(kl), kneeR: Math.round(kl + 10), leftFeetY: Math.round(feetY * 1000) / 1000, rightFeetY: Math.round((feetY - 0.02) * 1000) / 1000 }));
  }
  return data;
}

function chk(name, cond, detail) {
  log(name + ': ' + (cond ? 'PASS' : 'FAIL') + (detail ? ' ' + detail : ''));
  return !!cond;
}

(async function () {
  var results = {};
  try {
    var scenarios = { double: genDouble(), single: genSingle(), stepClose: genStepClose(), run: genRun() };
    for (var name in scenarios) {
      var data = scenarios[name];
      var metrics = window.VTPose.computeJumpMetrics(data, { fps: 30 });
      var r = { jumps: metrics.ok ? metrics.jumps.map(function (j) { return { lo: j.liftoffTime, la: j.landingTime, ft: j.flightTime, src: j.source }; }) : [],
               steps: metrics.ok ? metrics.best.steps : null,
               takeoff: metrics.ok ? metrics.best.takeoff : null,
               msg: metrics.msg || null };
      results[name] = r;
      if (name === 'run') {
        chk('run.noJump', metrics.jumps.length === 0, JSON.stringify(r.jumps));
      } else if (name === 'stepClose') {
        // 并步场景：只断言恰好 1 次弹跳 + 双脚起跳（结构不同于标准助跑，帧级目标不适用）
        chk('stepClose.oneJump', metrics.ok && metrics.jumps.length === 1, JSON.stringify(r.jumps));
        chk('stepClose.takeoff', metrics.ok && metrics.best.takeoff.type === 'double', JSON.stringify(metrics.best.takeoff));
      } else {
        chk(name + '.oneJump', metrics.ok && metrics.jumps.length === 1, JSON.stringify(r.jumps));
        if (metrics.ok && metrics.jumps.length === 1) {
          var j = metrics.jumps[0];
          var ftOk = Math.abs(j.flightTime - 0.9667) <= 0.034;
          var loOk = Math.abs(j.liftoffTime - 1.733) <= 0.034;
          var laOk = Math.abs(j.landingTime - 2.7) <= 0.034;
          chk(name + '.flight', ftOk, 'ft=' + j.flightTime);
          chk(name + '.liftoff', loOk, 'lo=' + j.liftoffTime);
          chk(name + '.landing', laOk, 'la=' + j.landingTime);
        }
      }
    }
    // 双脚场景的步骤指标（对应 test.mp4 ground truth：pen 0.3 / last 0.1667）
    var st = results.double.steps;
    var md = window.VTPose.computeJumpMetrics(scenarios.double, { fps: 30 });
    if (md.ok) log('double.arm: degS=' + md.best.armSwingDegS + ' amp=' + md.best.armSwingAmp + ' lean=' + md.best.leanAngle + ' traj=' + md.best.trajAngle + ' kneeMin=' + md.best.kneeMin);
    // 步骤检测内部状态 dump（double 场景）
    (function () {
      var data = scenarios.double;
      var liftoffTime = (results.double.jumps[0] || {}).lo || 1.733;
      var rawF = data.map(function (d) { return (!d.lost && d.feetY !== null) ? d.feetY : null; });
      var rawH = data.map(function (d) { return (!d.lost && d.comH !== null) ? d.comH : null; });
      var n = rawF.length;
      var hf2 = [];
      for (var i2 = 0; i2 < n; i2++) {
        if (rawF[i2] !== null && rawH[i2] !== null) {
          var dist = rawF[i2] - (1 - rawH[i2] / 100);
          if (dist > 0.02 && dist < 0.8) hf2.push(dist);
        }
      }
      var scale = 0.12;
      if (hf2.length) { hf2.sort(function (a, b) { return a - b; }); scale = hf2[Math.floor(hf2.length / 2)]; }
      var win = [];
      for (var i = 0; i < n; i++) {
        if (rawF[i] === null) continue;
        if (data[i].t < liftoffTime - 0.35 || data[i].t >= liftoffTime - 0.02) continue;
        win.push(rawF[i]);
      }
      var ws = win.slice().sort(function (a, b) { return a - b; });
      var ground = ws[Math.floor(ws.length * 0.85)];
      var th = ground - 0.02;
      var contact = new Array(n);
      for (var j = 0; j < n; j++) {
        if (rawF[j] === null) { contact[j] = false; continue; }
        var c = 0;
        if (j > 0 && rawF[j - 1] !== null && rawF[j - 1] >= th) c++;
        if (rawF[j] >= th) c++;
        if (j < n - 1 && rawF[j + 1] !== null && rawF[j + 1] >= th) c++;
        contact[j] = c >= 2;
      }
      var segs = [];
      var st2 = -1;
      for (var k = 0; k < n; k++) {
        if (contact[k] && st2 < 0) st2 = k;
        else if (!contact[k] && st2 >= 0) { segs.push([st2, k - 1]); st2 = -1; }
      }
      if (st2 >= 0) segs.push([st2, n - 1]);
      log('stepsD: liftoff=' + liftoffTime + ' scale=' + scale.toFixed(3) + ' winN=' + win.length + ' ground=' + ground.toFixed(4) + ' th=' + th.toFixed(4));
      log('stepsD segs: ' + JSON.stringify(segs));
      log('stepsD gapTh=' + (ground - Math.max(scale * 0.4, 0.045)).toFixed(4) + ' dip feet 37-46: ' + rawF.slice(37, 47).map(function (v) { return v.toFixed(3); }).join(','));
    })();
    if (st && st.found === 2) {
      chk('double.steps', Math.abs(st.penultimateContact - 0.3) <= 0.034 && Math.abs(st.lastContact - 0.1667) <= 0.034,
        JSON.stringify(st));
    } else {
      chk('double.steps', false, JSON.stringify(st));
    }
    if (results.double.takeoff) {
      chk('double.takeoff', results.double.takeoff.type === 'double', JSON.stringify(results.double.takeoff));
    }
    if (results.single.takeoff) {
      chk('single.takeoff', results.single.takeoff.type === 'single', JSON.stringify(results.single.takeoff));
    }
    log('done');
    var b64 = btoa(unescape(encodeURIComponent(JSON.stringify({ results: results, log: window.__log }))));
    await fetch('/save', { method: 'POST', body: JSON.stringify({ name: 'synthetic.json', dataUrl: 'data:application/json;base64,' + b64 }) });
    log('saved');
  } catch (e) {
    log('ERR: ' + String(e && e.stack || e));
  }
})();
</script>
</body>
</html>
