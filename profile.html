  <div class="pf-wrap">
    <div class="pf-head">
      <h1>👤 我的资料 · 扣篮差距</h1>
      <div class="pf-sub">填写站立摸高，立刻算出你和扣篮还差多少。</div>
    </div>

    <div class="gap-card" id="gapCard" style="display:none;">
      <div class="small">你的站立摸高：<b id="gapReach">--</b> cm</div>
      <div class="big" id="gapText">--</div>
    </div>
    <div class="pf-guide" id="gapGuide">先填写下方「站立摸高」，马上告诉你距离扣篮还差多少 👇</div>

    <div class="pf-card">
      <label>📐 个人资料</label>
      <div class="pf-row"><span>昵称</span><input type="text" id="inNick" maxlength="16" placeholder="上榜时展示的昵称（可不填）"><span class="pf-unit"></span></div>
      <div class="pf-row"><span>身高</span><input type="number" id="inHeight" min="100" max="250" step="1" placeholder="例如 175"><span class="pf-unit">cm</span></div>
      <div class="pf-row"><span>站立摸高</span><input type="number" id="inReach" min="150" max="350" step="1" placeholder="例如 248"><span class="pf-unit">cm</span></div>
      <div class="pf-row"><span>体重</span><input type="number" id="inWeight" min="30" max="200" step="0.5" placeholder="例如 72"><span class="pf-unit">kg</span></div>
      <div class="pf-row"><span>臂展</span><input type="number" id="inWing" min="120" max="280" step="1" placeholder="例如 185"><span class="pf-unit">cm</span></div>
      <div class="pf-row" style="align-items:flex-start;">
        <span>公开榜单</span>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;font-size:0.85rem;">
          <input type="checkbox" id="inPublic" style="width:18px;height:18px;accent-color:var(--accent);">
          <span style="color:var(--text2);">将我的弹跳数据展示在公开榜单（只显示昵称/摸高，默认关闭）</span>
        </label>
      </div>
      <button class="jt-btn jt-btn-accent" id="btnSaveProfile">💾 保存资料</button>
    </div>

    <div class="pf-card">
      <label>📈 记录今天摸高成绩（同步到进步曲线）</label>
      <div class="pf-row"><span>摸高成绩</span><input type="number" id="inTouch" min="150" max="350" step="1" placeholder="例如 300"><span class="pf-unit">cm</span></div>
      <button class="jt-btn jt-btn-outline" id="btnSaveTouch">📝 记录摸高</button>
    </div>
  </div>

  <div class="jt-toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js?v=15"></script>
  <script>
    (function () {
      'use strict';
      var Auth = window.JTAuth;
      var RIM = 305, DUNK = 315; // 标准篮筐 305cm，扣篮最低摸高约 315cm

      function toast(msg, type) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'jt-toast show ' + (type || '');
        setTimeout(function () { t.className = 'jt-toast'; }, 2600);
      }

      var lastReach = 0, lastGap = 0;

      function renderGap(reach) {
        var card = document.getElementById('gapCard');
        var guide = document.getElementById('gapGuide');
        if (!reach || reach <= 0) { card.style.display = 'none'; guide.style.display = 'block'; return; }
        card.style.display = 'flex';
        guide.style.display = 'none';
        var gap = DUNK - reach;
        if (gap <= 0) {
          document.getElementById('gapText').textContent = '🎉 已达扣篮标准，直接起飞！';
        } else {
          // 关键数字滚动动画：从旧值平滑滚到新值
          document.getElementById('gapText').innerHTML =
            '想要扣标准篮筐，你还需要提升 <b id="gapNum">' + lastGap + '</b>cm 摸高';
          window.UX && window.UX.animateNumber(document.getElementById('gapNum'), gap, { from: lastGap, duration: 700 });
        }
        window.UX && window.UX.animateNumber(document.getElementById('gapReach'), reach, { from: lastReach, duration: 700 });
        lastReach = reach;
        lastGap = gap;
      }

      function load() {
        Auth.getProfile().then(function (p) {
          if (p) {
            if (p.nickname) document.getElementById('inNick').value = p.nickname;
            if (p.height_cm != null) document.getElementById('inHeight').value = p.height_cm;
            if (p.reach_cm != null) document.getElementById('inReach').value = p.reach_cm;
            if (p.weight_kg != null) document.getElementById('inWeight').value = p.weight_kg;
            if (p.wingspan_cm != null) document.getElementById('inWing').value = p.wingspan_cm;
            document.getElementById('inPublic').checked = !!p.public_show;
            renderGap(p.reach_cm);
          } else {
            renderGap(null);
          }
        });
      }

      document.getElementById('btnSaveProfile').addEventListener('click', function () {
        var data = {
          nickname: document.getElementById('inNick').value.trim() || null,
          height_cm: parseFloat(document.getElementById('inHeight').value) || null,
          reach_cm: parseFloat(document.getElementById('inReach').value) || null,
          weight_kg: parseFloat(document.getElementById('inWeight').value) || null,
          wingspan_cm: parseFloat(document.getElementById('inWing').value) || null,
          public_show: document.getElementById('inPublic').checked
        };
        if (!data.reach_cm) return toast('请至少填写站立摸高，才能计算扣篮差距', 'err');
        if (data.public_show && !data.nickname) return toast('开启公开榜单需要先填写昵称', 'err');
        Auth.saveProfile(data).then(function (res) {
          if (res.error) return toast('保存失败: ' + (res.error.message || ''), 'err');
          renderGap(data.reach_cm);
          toast(data.public_show ? '已保存，你的成绩将展示在排行榜' : '已保存，未公开成绩', 'ok');
        });
      });

      document.getElementById('btnSaveTouch').addEventListener('click', function () {
        var v = parseFloat(document.getElementById('inTouch').value);
        if (!v || v <= 0) return toast('请输入摸高成绩', 'err');
        Auth.saveTouchRecord(v).then(function (res) {
          if (res.error) return toast('保存失败: ' + (res.error.message || ''), 'err');
          document.getElementById('inTouch').value = '';
          try { localStorage.setItem('vertrise-jump-saved', String(Date.now())); } catch (e) {}
          toast('摸高已记录', 'ok');
        });
      });

      Auth.init(function (session) {
        if (!session) { location.href = 'login.html?next=profile.html'; return; }
        load();
      });
    })();
  </script>
