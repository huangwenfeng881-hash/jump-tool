      <div class="pf-row"><span>昵称</span><input type="text" id="inNick" maxlength="16" placeholder="上榜时展示的昵称（可不填）"><span class="pf-unit"></span></div>

      <div class="pf-row"><span>臂展</span><input type="number" id="inWing" min="120" max="280" step="1" placeholder="例如 185"><span class="pf-unit">cm</span></div>

        <span>公开榜单</span>

      <button class="jt-btn jt-btn-outline" id="btnSaveTouch">📝 记录摸高</button>

  <script src="js/store.js?v=20261121"></script>
<script src="js/vendor/supabase.js?v=20261120"></script>
  <script src="js/supabase-config.js?v=20261120"></script>

  <script src="js/ui.js?v=20261120"></script>
  <script>
    (function () {
      'use strict';
      var Auth = window.JTAuth;
      var RIM = 305, DUNK = 315; // 标准篮筐 305cm，扣篮最低摸高约 315cm

      function toast(msg, type) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'jt-toast show ' + (type || '');
        setTimeout(function () { t.className = 'jt-toast'; }, 2600);
      }

      var lastReach = 0, lastGap = 0;

      function renderGap(reach) {
        var card = document.getElementById('gapCard');
        var guide = document.getElementById('gapGuide');
        if (!reach || reach <= 0) { card.style.display = 'none'; guide.style.display = 'block'; return; }
        card.style.display = 'flex';
        guide.style.display = 'none';
        var gap = DUNK - reach;
        if (gap <= 0) {
          document.getElementById('gapText').textContent = '🎉 已达扣篮标准，直接起飞！';
        } else {
          // 关键数字滚动动画：从旧值平滑滚到新值
          document.getElementById('gapText').innerHTML =
            '想要扣标准篮筐，你还需要提升 <b id="gapNum">' + lastGap + '</b>cm 摸高';
          window.UX && window.UX.animateNumber(document.getElementById('gapNum'), gap, { from: lastGap, duration: 700 });
        }
        window.UX && window.UX.animateNumber(document.getElementById('gapReach'), reach, { from: lastReach, duration: 700 });
        lastReach = reach;
        lastGap = gap;
      }

      function load() {
        Auth.getProfile().then(function (p) {
          if (p) {
            if (p.nickname) document.getElementById('inNick').value = p.nickname;
            if (p.height_cm != null) document.getElementById('inHeight').value = p.height_cm;
            if (p.reach_cm != null) document.getElementById('inReach').value = p.reach_cm;
            if (p.weight_kg != null) document.getElementById('inWeight').value = p.weight_kg;
            if (p.wingspan_cm != null) document.getElementById('inWing').value = p.wingspan_cm;
            document.getElementById('inPublic').checked = !!p.public_show;
            renderGap(p.reach_cm);
          } else {
            renderGap(null);
          }
        });
      }

      document.getElementById('btnSaveProfile').addEventListener('click', function () {
        var data = {
          nickname: document.getElementById('inNick').value.trim() || null,
          height_cm: parseFloat(document.getElementById('inHeight').value) || null,
          reach_cm: parseFloat(document.getElementById('inReach').value) || null,
          weight_kg: parseFloat(document.getElementById('inWeight').value) || null,
          wingspan_cm: parseFloat(document.getElementById('inWing').value) || null,
          public_show: document.getElementById('inPublic').checked
        };
        if (!data.reach_cm) return toast('请至少填写站立摸高，才能计算扣篮差距', 'err');
        if (data.public_show && !data.nickname) return toast('开启公开榜单需要先填写昵称', 'err');
        if (!Auth.current || !Auth.current()) {
          // 未登录：存本机（训练/评估/训练计划都用这份数据）
          var p0 = (window.JTStore && JTStore.getProfile()) || {};
          if (data.height_cm) p0.height = data.height_cm;
          if (data.weight_kg) p0.weight = data.weight_kg;
          if (data.reach_cm) p0.standingReach = data.reach_cm;
          if (data.wingspan_cm) p0.armspan = data.wingspan_cm;
          if (window.JTStore) JTStore.saveProfile(p0);
          renderGap(data.reach_cm);
          if (window.renderVtBody) window.renderVtBody();
          toast('已保存到本机（登录后可同步到云端）', 'ok');
          return;
        }
        Auth.saveProfile(data).then(function (res) {
          if (res.error) return toast('保存失败: ' + (res.error.message || ''), 'err');
          renderGap(data.reach_cm);
          try {
            if (window.JTStore) {
              var sp = JTStore.getProfile() || {};
              if (data.height_cm) sp.height = data.height_cm;
              if (data.weight_kg) sp.weight = data.weight_kg;
              if (data.reach_cm) sp.standingReach = data.reach_cm;
              if (data.wingspan_cm) sp.armspan = data.wingspan_cm;
              JTStore.saveProfile(sp);
              if (window.renderVtBody) window.renderVtBody();
            }
          } catch (e) {}
          toast(data.public_show ? '已保存，你的成绩将展示在排行榜' : '已保存，未公开成绩', 'ok');
        });
      });

      document.getElementById('btnSaveTouch').addEventListener('click', function () {
        var v = parseFloat(document.getElementById('inTouch').value);
        if (!v || v <= 0) return toast('请输入摸高成绩', 'err');
        Auth.saveTouchRecord(v).then(function (res) {
          if (res.error) return toast('保存失败: ' + (res.error.message || ''), 'err');
          document.getElementById('inTouch').value = '';
          try { localStorage.setItem('vertrise-jump-saved', String(Date.now())); } catch (e) {}
          toast('摸高已记录', 'ok');
        });
      });

      function loadLocal() {
        var p = (window.JTStore && JTStore.getProfile()) || null;
        if (p) {
          if (p.standingReach) document.getElementById('inReach').value = p.standingReach;
          if (p.height) document.getElementById('inHeight').value = p.height;
          if (p.weight) document.getElementById('inWeight').value = p.weight;
          if (p.armspan) document.getElementById('inWing').value = p.armspan;
          renderGap(p.standingReach || null);
        } else {
          renderGap(null);
        }
        if (window.renderVtBody) window.renderVtBody();
      }

      Auth.init(function (session) {
        if (!session) {
          // 未登录也能看本机资料；云端同步只是可选增强
          loadLocal();
          var tip = document.getElementById('vtLoginTip');
          if (tip) tip.style.display = 'block';
          return;
        }
        load();
      });
    })();
  </script>

<script>
(function () {
  'use strict';
  var ROWS = [
    ['height', '身高', 'cm'], ['weight', '体重', 'kg'], ['armspan', '臂展', 'cm'],
    ['standingReach', '站立摸高', 'cm'], ['vertStand', '原地起跳', 'cm'], ['vertRun', '助跑起跳', 'cm'],
    ['sprint100', '100 米', 's'], ['standingJump', '立定跳远', 'cm'], ['rsi', 'RSI', ''],
    ['clean', '高翻', 'kg'], ['squat', '深蹲', 'kg'], ['deadlift', '硬拉', 'kg'], ['colds', '每月感冒', '次']
  ];
  function render() {
    var box = document.getElementById('vtBodyInner');
    if (!box || !window.JTStore) return;
    var p = JTStore.getProfile();
    var a = JTStore.getAssessment();
    if (!p || !p.height || !p.weight) {
      box.innerHTML = '还没有完整体测资料。<br>去填 13 项数据，就能得到训练者类型和一周训练计划。' +
        '<div style="margin-top:10px"><a class="jt-btn jt-btn-accent jt-btn-sm" href="profile-setup.html">去填写</a></div>';
      return;
    }
    var html = '';
    if (a && a.type) {
      html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
        '<span style="font-size:1.05rem;font-weight:800;color:var(--text)">' + a.type.name + '</span>' +
        '<span style="font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--border)">平均 ' + (a.avgGrade || 0).toFixed(1) + '/5</span>' +
        (a.weak && a.weak.length ? '<span style="font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--border)">短板：' + a.weak.join('、') + '</span>' : '') +
        '</div>';
      if (a.type.desc) html += '<div style="font-size:.8rem;line-height:1.6;margin-bottom:10px">' + a.type.desc + '</div>';
    } else {
      html += '<div style="margin-bottom:10px">还没有评估结果，<a class="jt-link" href="profile-setup.html">去生成</a></div>';
    }
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:.82rem">';
    ROWS.forEach(function (r) {
      var v = p[r[0]];
      var txt = (v === null || v === undefined || v === '') ? '—' : (v + (r[2] ? ' ' + r[2] : ''));
      html += '<div style="display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--border);padding-bottom:4px">' +
        '<span style="color:var(--text2)">' + r[1] + '</span><b>' + txt + '</b></div>';
    });
    html += '</div>';
    if (a && a.steps && a.steps.length) {
      html += '<div style="margin-top:12px;font-size:.78rem;line-height:1.8">';
      a.steps.forEach(function (st) {
        html += '<div style="display:flex;justify-content:space-between;gap:8px"><span>' + st.index + '. ' + st.title + '</span><span>' + st.label + '</span></div>';
      });
      html += '</div>';
    }
    html += '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<a class="jt-btn jt-btn-sm" href="workout.html">看一周训练</a>' +
      '<a class="jt-btn jt-btn-ghost jt-btn-sm" href="profile-setup.html">重新评估</a></div>';
    box.innerHTML = html;
  }
  window.renderVtBody = render;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
  else render();
  setTimeout(render, 400);
})();
</script>
