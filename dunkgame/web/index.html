<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DunkSim · 扣篮模拟器 v0.2</title>
<style>
  :root{--bg:#06070b;--line:#252735;--text:#EDEEF5;--sub:#9AA0B4;--accent:#6E8CFF;--ok:#3EE0BE;--warn:#FF7A45}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .top{position:fixed;top:0;left:0;right:0;padding:14px 16px;pointer-events:none}
  .stat{font-size:13px;color:var(--sub);line-height:1.75;text-shadow:0 2px 8px rgba(0,0,0,.9)}
  .stat b{color:#fff}
  .stat .gap{color:var(--warn);font-weight:700}
  .stat .can{color:var(--ok);font-weight:700}
  #importBar{margin-top:10px;pointer-events:auto}
  #btnImport,#btnPreview{background:rgba(110,140,255,.16);border:1px solid rgba(110,140,255,.5);color:#cdd6ff;
    border-radius:9px;padding:6px 12px;font-size:12px;font-weight:700}
  #importTip{font-size:11px;color:#6d7488;margin-left:8px}
  #btnPreview{margin-left:8px;border:1px solid rgba(62,224,190,.5);color:#b6f5e5;background:rgba(62,224,190,.10)}
  #result{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:40px;font-weight:900;
    letter-spacing:2px;opacity:0;transition:opacity .2s,transform .2s;transform:scale(.85);pointer-events:none;
    text-shadow:0 6px 30px rgba(0,0,0,.85)}
  #result.show{opacity:1;transform:scale(1)}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .12s}
  .bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;
    padding:12px 14px 18px;background:linear-gradient(to top,rgba(6,7,11,.96),rgba(6,7,11,0))}
  .row{display:flex;gap:8px;margin-bottom:8px}
  .field{flex:1;background:#11121a;border:1px solid var(--line);border-radius:10px;padding:7px 9px}
  .field label{display:block;font-size:11px;color:var(--sub);margin-bottom:2px}
  .field input{width:100%;background:transparent;border:0;color:#fff;font-size:16px;font-weight:700;outline:none}
  #go{width:100%;height:54px;border:0;border-radius:14px;background:var(--accent);color:#fff;
    font-size:19px;font-weight:800;letter-spacing:2px}
  #go:active{filter:brightness(.9)}
  #timing{position:fixed;left:50%;bottom:236px;transform:translateX(-50%);width:220px;height:14px;
    border-radius:8px;background:#1b1d27;overflow:hidden;opacity:0;transition:opacity .15s}
  #timing.show{opacity:1}
  #zone{position:absolute;top:0;bottom:0;background:rgba(62,224,190,.35);left:52%;width:26%}
  #marker{position:absolute;top:-3px;bottom:-3px;width:4px;background:#fff;left:0;border-radius:2px}
  .hint{position:fixed;left:0;right:0;bottom:268px;text-align:center;font-size:13px;color:var(--sub);
    padding:0 16px;text-shadow:0 2px 8px rgba(0,0,0,.9)}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#06070b;
    color:var(--sub);font-size:15px;z-index:9;transition:opacity .4s}

  #btnTune{background:rgba(255,180,70,.14);border:1px solid rgba(255,180,70,.5);color:#ffd79a;margin-left:8px}
  #tune{position:fixed;right:14px;top:120px;width:290px;max-height:calc(100vh - 150px);overflow:auto;
        background:rgba(16,18,26,.94);border:1px solid rgba(110,140,255,.35);border-radius:14px;
        padding:12px;font-size:12px;color:#cfd6e6;display:none;z-index:30;pointer-events:auto;
        box-shadow:0 12px 40px rgba(0,0,0,.5);backdrop-filter:blur(8px)}
  #tune.show{display:block}
  #tune h4{margin:0 0 8px;font-size:13px;color:#8fa4ff;font-weight:600}
  #tune .row{display:flex;align-items:center;gap:6px;margin:5px 0}
  #tune .row label{width:62px;color:#9aa5bd;flex:none}
  #tune input[type=range]{flex:1;min-width:0;accent-color:#6E8CFF}
  #tune .val{width:46px;text-align:right;color:#3EE0BE;font-variant-numeric:tabular-nums}
  #tune .frame{display:flex;gap:6px;margin-bottom:8px}
  #tune .frame button{flex:1;padding:5px 0;font-size:11px}
  #tune textarea{width:100%;height:64px;margin-top:8px;background:#0c0e14;color:#9fe8d8;
                 border:1px solid rgba(110,140,255,.3);border-radius:8px;font-size:11px;padding:6px;resize:vertical}
  #tune .btns{display:flex;gap:6px;margin-top:8px}
  #tune .btns button{flex:1;padding:6px 0;font-size:11px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">加载球员模型…</div>
<script>
window.addEventListener('error', e => {
  const el = document.getElementById('loading');
  if (el) el.textContent = 'JS 错误：' + (e.message || e.error);
});
window.addEventListener('unhandledrejection', e => {
  const el = document.getElementById('loading');
  if (el) el.textContent = '模块错误：' + (e.reason && e.reason.message || e.reason);
});
</script>

<div class="top">
  <div class="stat" id="stat"></div>
  <div id="importBar"><button id="btnImport">＋ 导入我的扣篮动作（FBX/GLB）</button><button id="btnPreview">▶ 预览动作</button><button id="btnTune">🎛 调参</button><span id="importTip">把动捕文件拖到画面里也可以</span></div>
</div>
<input type="file" id="fileInput" accept=".fbx,.glb,.gltf" style="display:none">
<div id="result"></div>

<div class="bottom">
  <div class="row">
    <div class="field"><label>身高 cm</label><input id="iHeight" value="181" inputmode="decimal"></div>
    <div class="field"><label>臂展 cm</label><input id="iArm" value="183" inputmode="decimal"></div>

  </div>
  <div class="row">
    <div class="field"><label>弹跳 cm</label><input id="iJump" value="80" inputmode="decimal"></div>

  </div>

<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { retargetClip } from 'three/addons/utils/SkeletonUtils.js';

const RIM_H = 3.05, NEED = 320, G = 9.81, HOOP_Z = -3.2;  // NEED 单位 cm
const $ = id => document.getElementById(id);

// ---------------- 渲染器 ----------------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);
scene.fog = new THREE.Fog(0x05060a, 16, 40);

const camera = new THREE.PerspectiveCamera(44, 1, 0.1, 120);
camera.position.set(3.1, 2.55, 5.8);

// ---------------- 灯光 ----------------
scene.add(new THREE.HemisphereLight(0xa8bcff, 0x3a2612, 1.45));

const key = new THREE.DirectionalLight(0xfff2e0, 3.2);
key.position.set(6, 10, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
const sc = key.shadow.camera;
sc.left=-12; sc.right=12; sc.top=12; sc.bottom=-12; sc.near=1; sc.far=40;
scene.add(key);

const rimSpot = new THREE.SpotLight(0xffb070, 90, 14, 0.62, 0.5, 1.6);
rimSpot.position.set(0, 5.6, HOOP_Z + 0.4);
rimSpot.target.position.set(0, 3.0, HOOP_Z - 0.2);
scene.add(rimSpot); scene.add(rimSpot.target);

const backLight = new THREE.PointLight(0x5f7bff, 26, 16);
backLight.position.set(-5, 3.4, -3.0);
scene.add(backLight);

// ---------------- 程序化贴图 ----------------
function woodTexture(){
  const s = 1024, c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  x.fillStyle = '#7a4f2c'; x.fillRect(0,0,s,s);
  for(let i=0;i<220;i++){
    const y = Math.random()*s, h = 4+Math.random()*26;
    x.fillStyle = 'rgba(0,0,0,'+(0.03+Math.random()*0.07)+')';
    x.fillRect(0, y, s, h);
    x.fillStyle = 'rgba(255,200,140,'+(0.015+Math.random()*0.03)+')';
    x.fillRect(0, y+h, s, 2);
  }
  for(let i=0;i<12;i++){
    x.strokeStyle = 'rgba(30,16,6,.35)'; x.lineWidth = 2+Math.random()*2;
    x.beginPath(); x.moveTo(0, i*s/12); x.lineTo(s, i*s/12); x.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6,6);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function ballTexture(){
  const s = 512, c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(s*0.35,s*0.3,20,s*0.5,s*0.5,s*0.7);
  g.addColorStop(0,'#ff9a4d'); g.addColorStop(1,'#c1490f');
  x.fillStyle = g; x.fillRect(0,0,s,s);
  x.strokeStyle = 'rgba(40,15,5,.85)'; x.lineWidth = 6;
  x.beginPath(); x.moveTo(0,s/2); x.lineTo(s,s/2); x.stroke();
  x.beginPath(); x.moveTo(s/2,0); x.lineTo(s/2,s); x.stroke();
  x.beginPath(); x.arc(s/2, -s*0.15, s*0.62, 0.35, Math.PI-0.35); x.stroke();
  x.beginPath(); x.arc(s/2, s*1.15, s*0.62, Math.PI+0.35, -0.35); x.stroke();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ---------------- 球场 ----------------
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(44, 44),
  new THREE.MeshStandardMaterial({map: woodTexture(), roughness:0.62, metalness:0.04})
);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

const lineMat = new THREE.MeshStandardMaterial({color:0xf2f4fa, roughness:0.5, emissive:0x111111});
function courtLine(w,d,x,z,rot=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,0.012,d), lineMat);
  m.position.set(x,0.008,z); m.rotation.y = rot; scene.add(m); return m;
}
for(let i=0;i<72;i++){
  const a = -Math.PI*0.92 + i*(Math.PI*0.92/71);
  courtLine(0.16,0.07, Math.cos(a)*6.75, Math.sin(a)*6.75 + HOOP_Z + 0.4, a);
}
courtLine(4.9,0.07,0,-4.6);
courtLine(5.8,0.07,0,-8.6);          // 底线
courtLine(0.07,30,0,-9.6);           // 边线附近

// ---------------- 看台 ----------------
const standMat = new THREE.MeshStandardMaterial({color:0x14161f, roughness:0.9});
const crowdMat = [0x2a3350,0x3d2a3f,0x243b32,0x3a3122].map(c=>new THREE.MeshStandardMaterial({color:c, roughness:0.9}));
for (let s=0; s<3; s++){
  const stand = new THREE.Mesh(new THREE.BoxGeometry(30, 1.0+s*0.9, 1.6), standMat);
  stand.position.set(0, 0.5+s*0.45, -13 + s*2.2);
  stand.receiveShadow = true;
  scene.add(stand);
  for (let i=0;i<26;i++){
    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.5,0.5), crowdMat[i%4]);
    seat.position.set(-13 + i*1.05, 1.1+s*0.9, -13 + s*2.2);
    scene.add(seat);
  }
}

// ---------------- 篮架 ----------------
const steel = new THREE.MeshStandardMaterial({color:0x2a2d38, roughness:0.35, metalness:0.75});
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,3.7,18), steel);
pole.position.set(0,1.85,HOOP_Z-1.2); pole.castShadow = true; scene.add(pole);
const arm = new THREE.Mesh(new THREE.BoxGeometry(0.16,0.16,1.1), steel);
arm.position.set(0,3.65,HOOP_Z-0.75); scene.add(arm);
const base = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.5,0.9), steel);
base.position.set(0,0.25,HOOP_Z-1.4); base.castShadow = true; scene.add(base);

const glassMat = new THREE.MeshPhysicalMaterial({
  color:0xeaf2ff, transparent:true, opacity:0.22, roughness:0.05, metalness:0,
  transmission:0.85, thickness:0.4, ior:1.5
});
const board = new THREE.Mesh(new THREE.BoxGeometry(1.8,1.05,0.06), glassMat);
board.position.set(0,3.45,HOOP_Z-0.45); scene.add(board);
const frameMat = new THREE.MeshStandardMaterial({color:0xe63b2f, roughness:0.45, emissive:0x3a0a06});
const boardFrame = new THREE.Mesh(new THREE.BoxGeometry(1.84,0.05,0.06), frameMat);
boardFrame.position.set(0,3.99,HOOP_Z-0.45); scene.add(boardFrame);
const sq = new THREE.Mesh(new THREE.BoxGeometry(0.59,0.45,0.02), new THREE.MeshBasicMaterial({color:0xff5a3c}));
sq.position.set(0,3.28,HOOP_Z-0.41); scene.add(sq);

const rimMat = new THREE.MeshStandardMaterial({color:0xff5c14, roughness:0.3, metalness:0.85, emissive:0x4a1500});
const rim = new THREE.Mesh(new THREE.TorusGeometry(0.225,0.021,12,40), rimMat);
rim.position.set(0,RIM_H,HOOP_Z-0.15); rim.rotation.x = Math.PI/2; rim.castShadow = true; scene.add(rim);

// 网（用线段，落地会抖动）
const netPts = [];
const netSegs = 14;
for (let i=0;i<netSegs;i++){
  const a0 = i/netSegs*Math.PI*2, a1 = (i+1)/netSegs*Math.PI*2;
  const p0 = new THREE.Vector3(Math.cos(a0)*0.215, 0, Math.sin(a0)*0.215);
  const p1 = new THREE.Vector3(Math.cos(a1)*0.215, 0, Math.sin(a1)*0.215);
  const m0 = new THREE.Vector3(Math.cos(a0)*0.115, -0.42, Math.sin(a0)*0.115);
  const m1 = new THREE.Vector3(Math.cos(a1)*0.115, -0.42, Math.sin(a1)*0.115);
  netPts.push(p0,p1, p0,m0, m0,m1);
}
const netGeo = new THREE.BufferGeometry().setFromPoints(netPts);
const net = new THREE.LineSegments(netGeo, new THREE.LineBasicMaterial({color:0xdfe6f5, transparent:true, opacity:0.7}));
net.position.set(0, RIM_H, HOOP_Z-0.15);
scene.add(net);

// ---------------- 球 ----------------
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.121, 32, 24),
  new THREE.MeshStandardMaterial({map: ballTexture(), roughness:0.72, metalness:0.02})
);
ball.castShadow = true; ball.position.set(0.42,1.05,2.35); scene.add(ball);

// ---------------- 角色 ----------------
const playerRoot = new THREE.Group();
scene.add(playerRoot);
const mixerRefs = { mixers: [], actions: {}, bones: {}, model: null };
let ready = false;

const loader = new GLTFLoader();
const MODEL_KIND = (new URLSearchParams(location.search).get('model') === 'soldier') ? 'soldier' : 'xbot';
const MODEL_URL = MODEL_KIND === 'soldier' ? './models/Soldier.glb' : './models/Xbot.glb';
loader.load(MODEL_URL, gltf => {
  const model = gltf.scene;
  model.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh){
      o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      const names = mats.map(m => m && m.name).join(',');
      // 隐藏解剖"关节球"层，只保留皮肤
      if (names.includes('Joints')) { o.visible = false; return; }
      if (MODEL_KIND === 'xbot'){
        mats.forEach(m => {
          if (!m) return;
          m.map = null;
          m.vertexColors = true;
          m.roughness = 0.62; m.metalness = 0.0;
        });
        paintUniform(o, new THREE.Color(0xe8d3c0), new THREE.Color(0x2b3bd6), new THREE.Color(0x14161f));
      } else {
        mats.forEach(m => {
          if (!m) return;
          m.roughness = Math.min(0.85, (m.roughness ?? 0.7));
          m.metalness = 0.0;
        });
      }
    }
    if (o.isBone){
      mixerRefs.bones[o.name] = o;
    }
  });
  mixerRefs.handR = findBone('RightHand');
  mixerRefs.handL = findBone('LeftHand');
  playerRoot.add(model);
  mixerRefs.model = model;
  mixerRefs.clips = gltf.animations;
  const mixer = new THREE.AnimationMixer(model);
  mixerRefs.mixer = mixer;

  const byName = {};
  gltf.animations.forEach(c => {
    const a = mixer.clipAction(c);
    byName[c.name] = a;
    byName[c.name.toLowerCase()] = a;
  });
  mixerRefs.actions = byName;
  const idleA = byName['idle'];
  if (idleA) { idleA.play(); mixerRefs.current = 'idle'; }

  calibrateRig();
  // 依据骨架（头顶-脚底）计算模型真实身高，用于缩放
  model.updateMatrixWorld(true);
  const headB = findBone('Head') || findBone('HeadTop_End');
  const footB = findBone('LeftToeBase') || findBone('LeftFoot');
  let h = 1.8;
  if (headB && footB){
    const hv = new THREE.Vector3(), fv = new THREE.Vector3();
    headB.getWorldPosition(hv); footB.getWorldPosition(fv);
    h = Math.max(0.5, hv.y - fv.y) * 1.06;   // 头骨到脚趾，补一点余量
  } else {
    const box = new THREE.Box3().setFromObject(model);
    h = Math.max(0.5, box.max.y - box.min.y);
  }
  mixerRefs.baseHeight = h;

  ready = true;
  const q = new URLSearchParams(location.search);
  if (q.has('pr')){
    customPose = {
      armRaise: parseFloat(q.get('pr') || '0'),
      armIn: parseFloat(q.get('in') || '0'),
      elbow: parseFloat(q.get('el') || '0'),
      wrist: parseFloat(q.get('wr') || '0'),
      wristRoll: parseFloat(q.get('wrr') || '0'),
      wristYaw: parseFloat(q.get('wry') || '0'),
      hipL: parseFloat(q.get('hip') || '0'),
      hipR: parseFloat(q.get('hipR') || q.get('hip') || '0'),
      kneeL: parseFloat(q.get('knee') || '0'),
      kneeR: parseFloat(q.get('kneeR') || q.get('knee') || '0'),
      lean: parseFloat(q.get('lean') || '0'),
      twist: parseFloat(q.get('tw') || '0'),
    };
    if (mixerRefs.actions['idle']) { mixerRefs.actions['idle'].reset().play(); mixerRefs.current = 'idle'; }
  } else if (q.has('pose')){
    frozenPose = Math.max(0, Math.min(1, parseFloat(q.get('pose')) || 0));
    if (mixerRefs.actions['idle']) { mixerRefs.actions['idle'].reset().play(); mixerRefs.current = 'idle'; }
  } else if (q.has('preview')){
    setTimeout(() => startPreview(), 600);
  } else if (q.has('auto')){
    // 自动演示：助跑 → 0.66 时机自动起跳（调试用）
    autoJump = true;
    setTimeout(() => startRunup(), 900);
  }
  $('loading').style.opacity = 0;
  setTimeout(()=>$('loading').remove(), 500);
  applyHeight();
}, undefined, err => {
  $('loading').textContent = '模型加载失败：' + err;
});

/** 按绑定姿态的坐标给网格"穿"上球衣：躯干=球衣色、髋部=短裤色、其余=肤色 */
function paintUniform(mesh, skinC, jerseyC, shortC){
  const g = mesh.geometry;
  const pos = g.attributes.position;
  if (!pos) return;
  g.computeBoundingBox();
  const bb = g.boundingBox;
  const h = bb.max.y - bb.min.y;
  const midX = (bb.max.x + bb.min.x) * 0.5;
  const colors = new Float32Array(pos.count * 3);
  const skin = skinC || new THREE.Color(0xe8d3c0);
  const jersey = jerseyC || new THREE.Color(0x2b3bd6);
  const short = shortC || new THREE.Color(0x14161f);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const rel = (y - bb.min.y) / h;
    const dx = Math.abs(x - midX) / h;
    if (rel > 0.86) c.copy(skin);                       // 头颈
    else if (dx > 0.13) c.copy(skin);                   // 手臂（T-pose 时沿 X 方向）
    else if (rel > 0.62) c.copy(jersey);                // 躯干
    else if (rel > 0.47) c.copy(short);                 // 髋/短裤
    else c.copy(skin);                                  // 腿
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}

/** 按后缀找骨骼，兼容 mixamorig 前缀差异 */
function findBone(suffix){
  const b = mixerRefs.bones;
  for (const k in b){ const s = k.replace(/^mixamorig:?/i,''); if (s === suffix) return b[k]; }
  return null;
}

function play(name, fade=0.18){
  const key = name.toLowerCase();
  const a = mixerRefs.actions[key] || mixerRefs.actions[name];
  if (!a || mixerRefs.current === key) return;
  name = key;
  const prev = mixerRefs.actions[mixerRefs.current];
  a.reset().setEffectiveWeight(1).fadeIn(fade).play();
  if (prev && prev !== a) prev.fadeOut(fade);
  mixerRefs.current = name;
}

function applyHeight(){
  if (!mixerRefs.model) return;
  const target = num('iHeight',181) / 100;
  const base = mixerRefs.baseHeight || 1.8;
  const k = target / base;
  // 只缩放模型（影子等随之）
  mixerRefs.model.scale.setScalar(k);
}

// ================= 手动关键帧动画系统 =================
// 思路：不同模型的骨骼"静止朝向"不一样，直接写欧拉角会扭成麻花。
// 所以先在加载时自动标定每个骨骼"抬臂/屈肘/抬腿/屈膝/前倾"对应的轴和方向，
// 之后只写语义参数（armRaise / elbow / hip / knee / lean），换角色也能用。

const CAL = {};
const _q1 = new THREE.Quaternion();
const _e1 = new THREE.Euler();

function boneWorld(bone){
  bone.updateWorldMatrix(true, false);
  return new THREE.Vector3().setFromMatrixPosition(bone.matrixWorld);
}

function calibrate(boneName, score){
  const bone = findBone(boneName);
  if (!bone) return null;
  const base = bone.quaternion.clone();
  bone.updateWorldMatrix(true, true);
  const s0 = score();
  let best = null;
  for (let axis = 0; axis < 3; axis++){
    for (const sign of [-1, 1]){
      bone.quaternion.copy(base);
      _e1.set(axis === 0 ? 0.7 * sign : 0, axis === 1 ? 0.7 * sign : 0, axis === 2 ? 0.7 * sign : 0);
      bone.quaternion.multiply(_q1.setFromEuler(_e1));
      bone.updateWorldMatrix(true, true);
      let d = score() - s0;
      if (Math.abs(d) < 0.02){
        bone.quaternion.copy(base);
        _e1.set(axis === 0 ? 1.3 * sign : 0, axis === 1 ? 1.3 * sign : 0, axis === 2 ? 1.3 * sign : 0);
        bone.quaternion.multiply(_q1.setFromEuler(_e1));
        bone.updateWorldMatrix(true, true);
        d = score() - s0;
      }
      if (!best || d > best.d) best = { axis, sign, d };
      bone.quaternion.copy(base);
    }
  }
  bone.updateWorldMatrix(true, true);
  return best;
}

function calibrateRig(){
  const handL = () => boneWorld(findBone('LeftHand') || findBone('LeftForeArm')).y;
  const handR = () => boneWorld(findBone('RightHand') || findBone('RightForeArm')).y;
  const handLz = () => boneWorld(findBone('LeftHand') || findBone('LeftForeArm')).z;
  const handRz = () => boneWorld(findBone('RightHand') || findBone('RightForeArm')).z;
  const footL = () => boneWorld(findBone('LeftFoot') || findBone('LeftLeg'));
  const footR = () => boneWorld(findBone('RightFoot') || findBone('RightLeg'));
  const head = () => boneWorld(findBone('Head')).z;

  CAL.armL = calibrate('LeftArm', handL);
  CAL.armR = calibrate('RightArm', handR);
  CAL.elbowL = calibrate('LeftForeArm', handLz);
  CAL.elbowR = calibrate('RightForeArm', handRz);
  CAL.hipL = calibrate('LeftUpLeg', () => -footL().z);   // 腿往前 → 脚 z 变小
  CAL.hipR = calibrate('RightUpLeg', () => -footR().z);
  CAL.kneeL = calibrate('LeftLeg', () => -footL().y);   // 屈膝 → 脚抬高
  CAL.kneeR = calibrate('RightLeg', () => -footR().y);
  CAL.lean = calibrate('Spine', () => -head());          // 前倾 → 头往前
  // 内收：让左右手都往身体中线靠
  CAL.armInL = calibrate('LeftArm', () => boneWorld(findBone('LeftHand') || findBone('LeftForeArm')).x);
  CAL.armInR = calibrate('RightArm', () => -boneWorld(findBone('RightHand') || findBone('RightForeArm')).x);
  // 手腕：复用肘部弯曲轴
  CAL.wristL = CAL.elbowL;
  CAL.wristR = CAL.elbowR;
  console.log('CAL', JSON.stringify(CAL));
  try { const t = document.getElementById('importTip'); if (t) t.textContent = 'CAL: ' + Object.entries(CAL).map(([k,v]) => k + '=' + (v ? v.axis + (v.sign>0?'+':'-') + v.d.toFixed(2) : 'x')).join(' '); } catch(e){}
}

function rot(boneName, cal, amount){
  const bone = findBone(boneName);
  if (!bone || !cal || Math.abs(amount) < 1e-4) return;
  _e1.set(0, 0, 0);
  if (cal.axis === 0) _e1.x = amount * cal.sign;
  else if (cal.axis === 1) _e1.y = amount * cal.sign;
  else _e1.z = amount * cal.sign;
  bone.quaternion.multiply(_q1.setFromEuler(_e1));
}

// 语义参数：armRaise(抬臂) elbow(屈肘) hipL/hipR(抬腿) kneeL/kneeR(屈膝) lean(前倾) twist(转体)
const Z = { armRaise: 0, armIn: 0, armInL: 0, armInR: 0, elbow: 0, wrist: 0, wristRoll: 0, wristYaw: 0, hipL: 0, hipR: 0, kneeL: 0, kneeR: 0, lean: 0, twist: 0 };

function applyPose(v){
  const p = Object.assign({}, Z, v);
  rot('LeftArm', CAL.armL, -p.armRaise);
  rot('RightArm', CAL.armR, -p.armRaise);
  rot('LeftForeArm', CAL.elbowL, -p.elbow);
  rot('RightForeArm', CAL.elbowR, -p.elbow);
  const _inL = (p.armInL !== undefined && p.armInL !== 0) ? p.armInL : p.armIn;
  const _inR = (p.armInR !== undefined && p.armInR !== 0) ? p.armInR : p.armIn;
  rot('LeftArm', CAL.armInL, _inL);
  rot('RightArm', CAL.armInR, _inR);
  rot('LeftHand', CAL.wristL, -p.wrist);
  rot('RightHand', CAL.wristR, p.wrist);
  // 手腕旋转：roll = 前臂轴自转（掌心转向），yaw = 左右摆
  rot('LeftHand', { axis: 1, sign: 1 }, p.wristRoll);
  rot('RightHand', { axis: 1, sign: -1 }, p.wristRoll);
  rot('LeftHand', { axis: 2, sign: 1 }, p.wristYaw);
  rot('RightHand', { axis: 2, sign: -1 }, p.wristYaw);
  rot('LeftUpLeg', CAL.hipL, p.hipL);
  rot('RightUpLeg', CAL.hipR, p.hipR);
  rot('LeftLeg', CAL.kneeL, p.kneeL);
  rot('RightLeg', CAL.kneeR, p.kneeR);
  rot('Spine', CAL.lean, -p.lean);
  // 转体：直接绕 Spine 局部 Y 轴
  const sp = findBone('Spine');
  if (sp && Math.abs(p.twist) > 1e-4){
    _e1.set(0, p.twist, 0);
    sp.quaternion.multiply(_q1.setFromEuler(_e1));
  }
}

// ---- 关键帧（语义参数，单位：弧度，约 1 弧度 ≈ 57°） ----
const KEYS = [
  // 0.00 蓄力：深蹲、手臂后摆
  { t: 0.00, ease: 'out', v: { armRaise: -0.20, armIn: 0.00, elbow: 0.25, wrist: -0.20, hipL: 0.95, hipR: 0.88, kneeL: 1.40, kneeR: 1.32, lean: 0.22, twist: 0.00 } },
  // 0.08 蹬地：腿伸直、手臂快速上摆
  { t: 0.08, ease: 'io',  v: { armRaise: 0.85, armIn: 0.04, elbow: 0.15, wrist: 0.00, hipL: 0.20, hipR: 0.15, kneeL: 0.35, kneeR: 0.30, lean: -0.05, twist: 0.00 } },
  // 0.24 上升：身体拉长、手臂上举
  { t: 0.24, ease: 'out', v: { armRaise: 1.75, armIn: -0.06, elbow: 0.10, wrist: 0.05, hipL: 0.05, hipR: 0.25, kneeL: 0.45, kneeR: 0.70, lean: -0.12, twist: 0.02 } },
  // 0.42 最高点：双手举球过顶并靠拢
  { t: 0.42, ease: 'io',  v: { armRaise: 2.35, armIn: -0.12, elbow: 0.00, wrist: 0.10, hipL: 0.20, hipR: 0.45, kneeL: 0.55, kneeR: 0.85, lean: -0.16, twist: 0.06 } },
  // 0.54 砸筐：前臂下压 + 手腕前甩，肩部带转
  { t: 0.54, ease: 'in',  v: { armRaise: 1.95, armIn: -0.10, elbow: 0.95, wrist: 0.90, wristRoll: 0.55, wristYaw: 0.00, hipL: 0.55, hipR: 0.70, kneeL: 0.80, kneeR: 0.90, lean: 0.22, twist: 0.28 } },
  // 0.62 挂筐：手仍抓住篮筐、身体吊住
  { t: 0.62, ease: 'out', v: { armRaise: 2.15, armIn: -0.10, elbow: 0.30, wrist: 0.55, wristRoll: 0.30, hipL: 0.45, hipR: 0.60, kneeL: 0.75, kneeR: 0.85, lean: 0.10, twist: 0.20 } },
  // 0.74 松手下落：手臂松开、腿开始放
  { t: 0.74, ease: 'in',  v: { armRaise: 1.30, armIn: -0.02, elbow: 0.45, wrist: 0.20, hipL: 0.30, hipR: 0.35, kneeL: 0.55, kneeR: 0.60, lean: 0.02, twist: 0.10 } },
  // 0.88 下落：伸腿找地、手臂张开平衡
  { t: 0.88, ease: 'in',  v: { armRaise: 0.45, armIn: -0.02, elbow: 0.25, wrist: 0.05, hipL: 0.05, hipR: 0.02, kneeL: 0.20, kneeR: 0.15, lean: -0.02, twist: 0.00 } },
  // 1.00 落地缓冲：深屈膝、手臂下垂
  { t: 1.00, ease: 'out', v: { armRaise: 0.15, armIn: 0.00, elbow: 0.35, wrist: -0.05, hipL: 0.80, hipR: 0.72, kneeL: 1.30, kneeR: 1.22, lean: 0.20, twist: 0.02 } },
];

const EASE = { linear: x => x, io: x => x * x * (3 - 2 * x), out: x => 1 - (1 - x) ** 2, in: x => x * x };

function poseAt(p){
  const t = Math.min(1, Math.max(0, p));
  let i = 0;
  while (i < KEYS.length - 2 && t > KEYS[i + 1].t) i++;
  const A = KEYS[i], B = KEYS[Math.min(i + 1, KEYS.length - 1)];
  const span = Math.max(1e-4, B.t - A.t);
  const k = (EASE[B.ease] || EASE.io)(Math.min(1, Math.max(0, (t - A.t) / span)));
  const out = {};
  const names = new Set([...Object.keys(A.v), ...Object.keys(B.v)]);
  names.forEach(n => { out[n] = THREE.MathUtils.lerp(A.v[n] || 0, B.v[n] || 0, k); });
  return out;
}

function dunkPose(progress){
  applyPose(poseAt(progress));
}

// 预览：原地播放一遍
const dunkPreview = { on: false, t: 0 };
let frozenPose = null;
let autoJump = false;
let customPose = null;

function startPreview(){
  dunkPreview.on = true;
  dunkPreview.t = 0;
  state = S.IDLE;
  if (mixerRefs.actions['idle']) { mixerRefs.actions['idle'].reset().play(); mixerRefs.current = 'idle'; }
  showResult('预览动作', '#6E8CFF', 1200);
}



function resetPose(){
  // 清掉手改的骨骼，交回动画控制
  if (mixerRefs.model) mixerRefs.model.traverse(o => { if (o.isBone) o.rotation.set(0,0,0); });
}

// ---------------- 数值 ----------------
function num(id, def=0){ const v = $(id).value.trim(); return v === '' ? def : (parseFloat(v) || def); }
function stats(){
  const h = num('iHeight',181), arm = num('iArm',183), w = num('iWeight',70), j = num('iJump',80);
  let reach = num('iReach',0); if(!reach) reach = arm*1.27;
  return {h, arm, w, j, reach, touch: reach + j, gap: NEED - (reach + j)};
}
function refreshStat(){
  const s = stats();
  const can = s.touch >= NEED;
  $('stat').innerHTML =
    `身高 <b>${s.h.toFixed(0)}</b> · 臂展 <b>${s.arm.toFixed(0)}</b> · 体重 <b>${s.w.toFixed(0)}</b>kg<br>` +
    `站立摸高 <b>${s.reach.toFixed(0)}</b> ＋ 弹跳 <b>${s.j.toFixed(0)}</b> ＝ 摸高 <b>${s.touch.toFixed(0)}</b>cm<br>` +
    (can ? `需要 ${NEED}cm → <span class="can">可以扣（富余 ${(-s.gap).toFixed(0)}cm）</span>`
         : `需要 ${NEED}cm → <span class="gap">还差 ${s.gap.toFixed(0)}cm</span>`);
}
['iHeight','iArm','iWeight','iJump','iReach'].forEach(id=>$(id).addEventListener('input', ()=>{ refreshStat(); applyHeight(); }));
refreshStat();

// ---------------- 状态机 ----------------
const S = {IDLE:'idle', RUNUP:'runup', AIR:'air', RESULT:'result'};
let state = S.IDLE, t = 0, v0 = 0, airT = 0, quality = 0.8, jumpH = 0, runT = 0, pressed = false;
const RUN_DUR = 1.15;
const HOME_Z = 4.8;        // 站位（助跑起点）
const TAKEOFF_Z = -1.4;    // 起跳点（助跑终点）
const RIM_APPROACH_Z = -3.15; // 腾空到达的位置（篮下）
let flashLevel = 0;
const camState = {shake:0};
const SLOWMO = (parseFloat(new URLSearchParams(location.search).get('slowmo')) || 1);

function showResult(text, color, ms=2200){
  const r = $('result');
  r.textContent = text; r.style.color = color; r.classList.add('show');
  clearTimeout(showResult._t);
  showResult._t = setTimeout(()=>r.classList.remove('show'), ms);
}

let runStartZ = HOME_Z;

function startRunup(){
  const s = stats();
  runStartZ = playerRoot.position.z;
  applyHeight();
  ball.position.set(0.42,1.05,5.15);
  state = S.RUNUP; runT = 0; pressed = false;
  if (customAction){ customAction.stop(); }
  play('run');
  $('go').textContent = '起跳！';
  $('hint').textContent = '白线进绿区时点「起跳」';
  $('timing').classList.add('show');
  $('result').classList.remove('show');
}

function doJump(){
  if (state !== S.RUNUP) return;
  pressed = true;
  const s = stats();
  const now = Math.min(runT / RUN_DUR, 1);
  let q;
  if (now >= 0.5 && now <= 0.78) {
    const c = 0.64; q = 1 - Math.abs(now - c) / 0.14 * 0.25;
  } else {
    q = 0.92 - Math.abs(now - 0.64) * 1.5;
  }
  quality = Math.max(0.6, Math.min(1.0, q));
  jumpH = s.j * quality;
  v0 = Math.sqrt(2*G*jumpH/100);
  airT = 2*v0/G;
  t = 0;
  state = S.AIR;
  if (mixerRefs.mixer) play('idle', 0.1);
  $('go').textContent = '助跑';
  $('timing').classList.remove('show');
  $('hint').textContent = '起跳中…';
}

function land(){
  if (customAction){ customAction.stop(); }
  const s = stats();
  const touch = s.reach + jumpH;
  const gap = NEED - touch;
  state = S.RESULT;
  playerRoot.position.y = 0;
  if (gap <= 0){
    showResult('扣进！', '#3EE0BE', 2600);
    flashLevel = 1;
    camState.shake = 0.35;
    ball.position.set(0, RIM_H-0.02, HOOP_Z-0.15);
    $('hint').textContent = `摸高 ${touch.toFixed(0)}cm · 时机 ${Math.round(quality*100)}% · 富余 ${(-gap).toFixed(0)}cm`;
  } else {
    showResult(`差 ${gap.toFixed(0)}cm`, '#FF7A45');
    $('hint').textContent = `摸高 ${touch.toFixed(0)}cm（时机 ${Math.round(quality*100)}%）· 弹跳再加 ${gap.toFixed(0)}cm 就能扣`;
  }
  setTimeout(()=>{
    if (state === S.RESULT){
      resetPose();
    }
  }, 900);
}

$('go').addEventListener('click', ()=>{
  if (state === S.RUNUP) doJump();
  else if (state === S.IDLE || state === S.RESULT) startRunup();
});
canvas.addEventListener('pointerdown', ()=>{ if (state === S.RUNUP) doJump(); });
addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); $('go').click(); } });

// ---------------- 导入自己的扣篮动作 ----------------
let customClip = null, customAction = null;

function boneMapFor(srcClip){
  // 按骨骼后缀把源轨道的名字映射到我们角色的骨骼
  const map = {};
  const names = new Set();
  mixerRefs.model && mixerRefs.model.traverse(o => { if (o.isBone) names.add(o.name); });
  const pick = (n) => {
    for (const k of names){ if (k.replace(/^mixamorig:?/i,'') === n.replace(/^mixamorig:?/i,'')) return k; }
    return null;
  };
  srcClip.tracks.forEach(tr => {
    const bone = tr.name.split('.')[0];
    if (!map[bone]) map[bone] = pick(bone) || bone;
  });
  return map;
}

function applyImportedAnimation(animRoot, clips, fileName){
  if (!clips || !clips.length){ setImportTip('这个文件里没有动画数据', true); return; }
  const clip = clips[0];
  customClip = clip;
  const srcSkinned = (() => { let s=null; animRoot.traverse(o=>{ if(!s && o.isSkinnedMesh) s=o; }); return s; })();
  const dstSkinned = (() => { let s=null; mixerRefs.model.traverse(o=>{ if(!s && o.isSkinnedMesh) s=o; }); return s; })();
  let action = null;
  try {
    if (srcSkinned && dstSkinned && clip.tracks.some(t => !mixerRefs.bones[t.name.split('.')[0]])){
      const nameMap = boneMapFor(clip);
      const retargeted = retargetClip(srcSkinned, dstSkinned, clip, { nameMap, fps: 30 });
      action = mixerRefs.mixer.clipAction(retargeted);
    } else {
      action = mixerRefs.mixer.clipAction(clip);
    }
  } catch (e) {
    try { action = mixerRefs.mixer.clipAction(clip); } catch(e2){ action = null; }
  }
  if (!action){ setImportTip('动作骨骼不匹配，已保留内置扣篮动作', true); return; }
  customAction = action;
  setImportTip(`已载入「${fileName}」· 起跳时会用这个动作`, false);
  showResult('动作已载入', '#6E8CFF', 1400);
}

function setImportTip(text, warn){
  const el = $('importTip');
  el.textContent = text;
  el.style.color = warn ? '#FF7A45' : '#3EE0BE';
}

function parseAnimFile(file){
  const name = file.name.toLowerCase();
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      if (name.endsWith('.fbx')){
        const obj = new FBXLoader().parse(ev.target.result, '');
        applyImportedAnimation(obj, obj.animations || [], file.name);
      } else {
        new GLTFLoader().parse(ev.target.result, '', g => {
          applyImportedAnimation(g.scene, g.animations || [], file.name);
        }, err => setImportTip('解析失败：' + err, true));
      }
    } catch (e){ setImportTip('解析失败：' + e.message, true); }
  };
  if (name.endsWith('.fbx')) reader.readAsArrayBuffer(file);
  else reader.readAsArrayBuffer(file);
}

$('btnImport').addEventListener('click', () => $('fileInput').click());
$('btnPreview').addEventListener('click', startPreview);
$('fileInput').addEventListener('change', e => { const f = e.target.files[0]; if (f) parseAnimFile(f); });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files && e.dataTransfer.files[0]) parseAnimFile(e.dataTransfer.files[0]);
});

// ---------------- 主循环 ----------------
const clock = new THREE.Clock();
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();
/** 球跟随手部骨骼 */
function holdBall(offset=0.05, both=false){
  const R = mixerRefs.handR, L = mixerRefs.handL;
  if (!R) return;
  R.getWorldPosition(_v1);
  if (both && L){
    L.getWorldPosition(_v2);
    _v1.add(_v2).multiplyScalar(0.5);
  }
  ball.position.copy(_v1);
  ball.position.y += offset;
}
const camLook = new THREE.Vector3(0, 2.0, 0.2);

function animate(){
  requestAnimationFrame(animate);
  const raw = Math.min(clock.getDelta(), 0.05);
  const dt = raw * SLOWMO;

  if (mixerRefs.mixer) mixerRefs.mixer.update(dt);

  if (state === S.RUNUP){
    runT += dt;
    const p = Math.min(runT / RUN_DUR, 1);
    playerRoot.position.z = THREE.MathUtils.lerp(runStartZ, TAKEOFF_Z, p);
    playerRoot.position.y = Math.abs(Math.sin(p*Math.PI*2))*0.03;
    playerRoot.rotation.y = Math.PI;
    ball.position.z = playerRoot.position.z - 0.15;
    ball.position.y = 1.05 + Math.abs(Math.sin(p*Math.PI*3))*0.1;
    $('marker').style.left = (p*100) + '%';
    holdBall(0.06);
    if (autoJump && !pressed && p >= 0.66) doJump();
    if (p >= 1 && !pressed) doJump();
  } else if (state === S.AIR){
    t += dt;
    const slow = (t > airT*0.32 && t < airT*0.68) ? 0.45 : 1.0;
    const y = v0*t - 0.5*G*t*t;
    playerRoot.position.y = Math.max(0, y);
    const ap = Math.min(t/airT, 1);
    playerRoot.position.z = THREE.MathUtils.lerp(TAKEOFF_Z, RIM_APPROACH_Z, 1 - Math.pow(1 - ap, 2.4));
    playerRoot.rotation.y = Math.PI;
    if (customAction){
      if (!customAction.isRunning()){ customAction.reset().setLoop(THREE.LoopOnce, 1); customAction.clampWhenFinished = true; customAction.play(); }
      customAction.timeScale = 1 / Math.max(0.35, airT * 1.15);
    } else {
      dunkPose(t/airT);
    }
    holdBall(0.02, true);
    if (t >= airT) land();
  } else {
    playerRoot.rotation.y = Math.PI;
    // 走回站位
    const dz = HOME_Z - playerRoot.position.z;
    if (Math.abs(dz) > 0.03 && !dunkPreview.on && frozenPose === null){
      const step = Math.sign(dz) * Math.min(Math.abs(dz), 4.5 * dt);
      playerRoot.position.z += step;
      if (state === S.RESULT) { state = S.IDLE; }
      if (mixerRefs.current !== 'run') play('run', 0.2);
    } else if (Math.abs(dz) <= 0.03 && mixerRefs.current === 'run' && state === S.IDLE){
      play('idle', 0.25);
    }
    holdBall(0.06);
    if (customPose){
      applyPose(customPose);
      holdBall(0.05, true);
    } else if (frozenPose !== null){
      dunkPose(frozenPose);
      holdBall(0.05, true);
    } else if (dunkPreview.on){
      dunkPreview.t += dt / 2.2;
      dunkPose(Math.min(1, dunkPreview.t));
      holdBall(0.05, true);
      if (dunkPreview.t >= 1){
        dunkPreview.on = false;
        resetPose();
        if (mixerRefs.mixer) play('idle', 0.25);
      }
    }
  }

  // 相机：跑动跟随 / 腾空拉远看向篮筐
  const pz = playerRoot.position.z;
  let camTarget = new THREE.Vector3(2.9, 2.45, pz + 6.2);
  let lookTarget = new THREE.Vector3(0, 1.9, pz - 0.4);
  if (state === S.AIR){
    const p = Math.min(t/airT, 1);
    camTarget.set(4.0, 3.15 + 0.35*p, pz + 4.6);
    lookTarget = new THREE.Vector3(0, 2.55 + 0.25*p, HOOP_Z + 1.0);
  } else if (state === S.RUNUP || state === S.RESULT){
    camTarget.set(3.1, 2.5, pz + 6.0);
    lookTarget = new THREE.Vector3(0, 1.8, pz - 1.2);
  }
  camera.position.lerp(camTarget, 0.06);
  if (camState.shake > 0){
    camera.position.x += (Math.random()-0.5)*camState.shake*0.35;
    camera.position.y += (Math.random()-0.5)*camState.shake*0.35;
    camState.shake *= 0.9;
  }
  camera.lookAt(lookTarget);

  // 白闪
  if (flashLevel > 0){ flashLevel = Math.max(0, flashLevel - 0.05); }
  $('flash').style.opacity = flashLevel * 0.85;

  renderer.render(scene, camera);
}

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
  if (w/h < 0.85){ camera.position.set(2.9, 2.6, 6.4); }
  camera.lookAt(camLook);
}
addEventListener('resize', resize);
resize();
animate();

// ================= 调参面板 =================
const TP = [
  ['armRaise', -0.6, 3.2, 0.01],
  ['armInL',   -0.5, 0.7, 0.01],
  ['armInR',   -0.5, 0.7, 0.01],
  ['elbow',    -0.2, 1.6, 0.01],
  ['wrist',    -0.8, 1.6, 0.01],
  ['wristRoll', -1.6, 1.6, 0.01],
  ['wristYaw',  -1.0, 1.0, 0.01],
  ['lean',     -0.5, 0.6, 0.01],
  ['twist',    -0.8, 0.8, 0.01],
  ['hipL',     -0.3, 1.3, 0.01],
  ['hipR',     -0.3, 1.3, 0.01],
  ['kneeL',    -0.3, 1.9, 0.01],
  ['kneeR',    -0.3, 1.9, 0.01],
];
let tuneIdx = 3;

function tuneBuild(){
  const box = document.getElementById('tuneSliders');
  if (!box || box.dataset.built) return;
  box.innerHTML = TP.map(([n, lo, hi, st]) =>
    '<div class="row"><label>' + n + '</label>' +
    '<input type="range" id="tn_' + n + '" min="' + lo + '" max="' + hi + '" step="' + st + '">' +
    '<span class="val" id="tv_' + n + '">0</span></div>').join('');
  TP.forEach(([n]) => {
    const el = document.getElementById('tn_' + n);
    el.addEventListener('input', () => { document.getElementById('tv_' + n).textContent = (+el.value).toFixed(2); tuneApply(); });
  });
  box.dataset.built = '1';
}

function tuneLoad(i){
  tuneIdx = Math.max(0, Math.min(KEYS.length - 1, i));
  const key = KEYS[tuneIdx];
  const v = Object.assign({ armInL: 0, armInR: 0 }, key.v);
  TP.forEach(([n]) => {
    const el = document.getElementById('tn_' + n);
    const val = (v[n] !== undefined) ? v[n] : (v.armIn !== undefined ? v.armIn : 0);
    el.value = val;
    document.getElementById('tv_' + n).textContent = (+val).toFixed(2);
  });
  document.getElementById('tuneTitle').textContent = '第 ' + (tuneIdx + 1) + '/' + KEYS.length + ' 帧 · t=' + key.t.toFixed(2);
  tuneApply();
}

function tuneApply(){
  const p = {};
  TP.forEach(([n]) => { p[n] = parseFloat(document.getElementById('tn_' + n).value) || 0; });
  frozenPose = null;
  customPose = p;
}

function tuneOut(){
  const p = {};
  TP.forEach(([n]) => { p[n] = +parseFloat(document.getElementById('tn_' + n).value).toFixed(2); });
  const key = KEYS[tuneIdx];
  const line = "{ t: " + key.t.toFixed(2) + ", ease: '" + key.ease + "', v: " +
    JSON.stringify(p).replace(/"([a-zA-Z]+)":/g, '$1: ').replace(/,/g, ', ') + " },";
  document.getElementById('tuneOut').value = line;
  return line;
}

function tuneInit(){
  tuneBuild();
  document.getElementById('btnTune').addEventListener('click', () => {
    document.getElementById('tune').classList.toggle('show');
    if (document.getElementById('tune').classList.contains('show')) tuneLoad(tuneIdx);
  });
  document.getElementById('tnPrev').addEventListener('click', () => tuneLoad(tuneIdx - 1));
  document.getElementById('tnNext').addEventListener('click', () => tuneLoad(tuneIdx + 1));
  document.getElementById('tnCopy').addEventListener('click', () => {
    const t = tuneOut();
    const ta = document.getElementById('tuneOut');
    ta.select();
    try { navigator.clipboard.writeText(t); } catch(e){}
  });
  document.getElementById('tnReset').addEventListener('click', () => tuneLoad(tuneIdx));
  if (new URLSearchParams(location.search).has('tune')){
    document.getElementById('tune').classList.add('show');
    tuneLoad(3);
  }
  if (autoJump && new URLSearchParams(location.search).has('tune')){
    tuneLoad(3);
  }
}
tuneInit();

</script>

<div id="tune">
  <h4>逐帧调参 <span id="tuneTitle" style="color:#6d7488;font-weight:400"></span></h4>
  <div class="frame">
    <button id="tnPrev">‹ 上一帧</button>
    <button id="tnNext">下一帧 ›</button>
  </div>
  <div id="tuneSliders"></div>
  <textarea id="tuneOut" spellcheck="false" placeholder="点「生成代码」复制这段贴给我"></textarea>
  <div class="btns">
    <button id="tnCopy">生成代码</button>
    <button id="tnReset">恢复原值</button>
  </div>
</div>
