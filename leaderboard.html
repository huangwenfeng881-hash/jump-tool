    <div id="lbList"></div>

  <div class="jt-toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js?v=15"></script>
  <script>
    (function () {
      'use strict';
      var Auth = window.JTAuth;

      function toast(msg, type) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'jt-toast show ' + (type || '');
        setTimeout(function () { t.className = 'jt-toast'; }, 2600);
      }

      function render(list) {
        var box = document.getElementById('lbList');
        if (!list || !list.length) {
          box.innerHTML = '<div class="lb-empty">还没有人上榜 🏀<br>去「<a class="jt-link" href="profile.html">我的</a>」页填写资料并开启「公开榜单」，你的成绩就会出现在这里。</div>';
          return;
        }
        box.innerHTML = list.map(function (r, i) {
          var f = function (v, unit) { return (v === null || v === undefined) ? '--' : (Number(v) + (unit || '')); };
          return '<div class="lb-card">' +
            '<span class="lb-rank ' + (i < 3 ? 'top' : '') + '">' + (i + 1) + '</span>' +
            '<span class="lb-name">' + (r.nickname || ('选手' + (i + 1))) + '</span>' +
            '<span class="lb-meta">' +
              '站立摸高 <b>' + f(r.reach_cm, 'cm') + '</b>' +
              '原地 <b>' + f(r.max_standing, 'cm') + '</b>' +
              '<span style="color:var(--accent);font-weight:800;">助跑 ' + f(r.max_running, 'cm') + '</span>' +
            '</span>' +
          '</div>';
        }).join('');
      }

      function load() {
        document.getElementById('lbList').innerHTML = '<div class="lb-empty">加载中…</div>';
        Auth.fetchLeaderboard().then(function (list) { render(list); });
      }

      document.getElementById('btnRefresh').addEventListener('click', load);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });

      Auth.init(function (session) {
        if (!session) { location.href = 'login.html?next=leaderboard.html'; return; }
        load();
      });
    })();
  </script>
