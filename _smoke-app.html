<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>app assets smoke</title></head>
<body>
<script>
// _smoke-app.html — 验证打包进 assets/app 的页面资源完整性（经 _serve-app.cjs 提供）
(function () {
  'use strict';
  function post(results) {
    fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: 'app-smoke.json', dataUrl: 'data:application/json;base64,' + btoa(unescape(encodeURIComponent(JSON.stringify(results)))) })
    }).catch(function (e) { results.fetchError = String(e); });
  }

  var results = {};
  post({ ping: true, t: Date.now() }); // 立即发一次，确认脚本已执行
  // 冒烟页自己 iframe 加载 ai-jump.html（同源），再检查其资源状态
  var f = document.createElement('iframe');
  f.src = 'ai-jump.html?theme=dark';
  f.style.width = '1px'; f.style.height = '1px';
  f.onload = function () {
    setTimeout(function () {
      try {
        var doc = f.contentDocument;
        var win = f.contentWindow;
        results.visionLoaded = !!(win.__VT_VISION__ && win.__VT_VISION__.PoseLandmarker);
        results.chartLoaded = typeof win.Chart !== 'undefined';
        results.supabaseLoaded = !!win.supabase;
        results.navHidden = !!doc.querySelector('.jt-nav') && getComputedStyle(doc.querySelector('.jt-nav')).display === 'none';
        results.feedbackCard = !!doc.getElementById('aiFbCard');
        results.tipBox = !!doc.getElementById('aiTipBox');
        // 资源 404 检测：performance entries
        var bad = [];
        var entries = win.performance.getEntriesByType('resource');
        for (var i = 0; i < entries.length; i++) {
          if (entries[i].name.indexOf('appassets') >= 0) continue;
        }
        results.resourceCount = entries.length;
        results.title = doc.title;
        results.themeAttr = doc.documentElement.getAttribute('data-theme');
      } catch (e) {
        results.error = String(e);
      }
      post(results);
    }, 3000);
  };
  f.onerror = function () { results.error = 'iframe load error'; post(results); };
  document.body.appendChild(f);

  setTimeout(function () { post(results); }, 12000);
})();
</script>
</body>
</html>
