<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>dump poses</title></head>
<body>
<!-- 回归夹具生成：对 test video/ 每个视频跑网页版引擎，导出 poseData + computeJumpMetrics 结果 -->
<script type="module">
  import { PoseLandmarker, FilesetResolver } from './mediapipe/tasks-vision/vision_bundle.mjs';
  window.__VT_VISION__ = { PoseLandmarker: PoseLandmarker, FilesetResolver: FilesetResolver };
</script>
<script src="js/supabase-config.js"></script>
<script>try { window.JTConfig.POSE_ANALYZE_MAXDIM = parseInt(new URLSearchParams(location.search).get('dim') || '480', 10); } catch (e) {}</script>
<script src="js/pose.js"></script>
<script>
(function () {
  'use strict';
  var P = window.VTPose;
  var VIDEOS = [
    '单脚，最后一步121到133，离地时刻134，落地时刻183.mp4',
    '单脚，最后一步触地42-47，离地时刻48，落地时刻74.mp4',
    '单脚，最后一步触地43-49，离地时刻50，落地时刻76.mp4',
    '单脚，最后一步触地51到61，离地时刻62，落地时刻113.mp4',
    '双脚，倒数第二步触地21-31，倒数第一步触地26-31，离地时刻32，落地时刻60.mp4',
    '双脚，倒数第二步触地33到43，倒数第一步触地37到43，离地时刻44，落地时刻71.mp4',
    '双脚，倒数第二步触地36-45，倒数第一步触地40-45，离地时刻46，落地时刻72.mp4',
    '双脚，倒数第二步触地44-53，倒数第一步触地49-53，离地时刻54，落地时刻92.mp4',
    '双脚，倒数第二步触地45-59，倒数第一步触地52到59，离地时刻60，落地时刻110.mp4',
    '双脚，倒数第二步触地53到71，倒数第一步触地60到71，离地时刻72，落地时刻126.mp4',
    '双脚，倒数第二步触地54-67，倒数第一步触地60到67，离地时刻68，落地时刻113.mp4',
    '双脚，倒数第二步触地54-69，倒数第一步触地61到69，离地时刻70，落地时刻120.mp4',
    '双脚，倒数第二步触地58到75，倒数第一步触地65到75，离地时刻76，落地时刻119.mp4',
    '双脚，倒数第二步触地63-81，倒数第一步触地73到81，离地时刻82，落地时刻133.mp4',
    '双脚，倒数第二步触地70到86，倒数第一步触地79到86，离地时刻87，落地时刻139.mp4',
    '双脚，倒数第二步触地74到94，倒数第一步触地83到94，离地时刻95，落地时刻142.mp4',
    '双脚，倒数第二步触地80到98，倒数第一步触地90到98，离地时刻99，落地时刻143.mp4',
    '双脚，倒数第二步触地82-99，倒数第一步触地89到99，离地时刻100，落地时刻151.mp4',
    '双脚，倒数第二步触地85到105，倒数第一步触地95到105，离地时刻106，落地时刻143.mp4',
    '双脚，倒数第二步触地86-104，倒数第一步触地96到104，离地时刻105，落地时刻150.mp4'
  ];

  function post(name, obj) {
    var body = 'data:application/json;base64,' + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    return fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, dataUrl: body })
    }).then(function () { console.log('saved ' + name); })
      .catch(function (e) { console.log('post fail ' + name + ': ' + e); });
  }

  // 错误上报：任何异常都 POST 一个 err 文件，方便定位
  window.onerror = function (msg, src, line, col, err) {
    try {
      post('err_' + (idx || 0) + '.json', { video: VIDEOS[idx - 1], msg: String(msg), src: src, line: line, stack: err && err.stack ? String(err.stack) : null });
    } catch (e) {}
    return false;
  };
  window.addEventListener('unhandledrejection', function (e) {
    try {
      post('err_' + (idx || 0) + '.json', { video: VIDEOS[idx - 1], unhandled: String((e.reason && e.reason.message) || e.reason) });
    } catch (x) {}
  });

  // ---- MP4 stsz 帧数解析（视频轨 sample 数） ----
  function parseFrames(buf) {
    var dv = new DataView(buf);
    function u32(o) { return dv.getUint32(o); }
    function type(o) { var t = ''; for (var i = 4; i < 8; i++) t += String.fromCharCode(dv.getUint8(o + i)); return t; }
    var top = [];
    var o = 0;
    while (o + 8 <= buf.byteLength) {
      var size = u32(o);
      if (size < 8) break;
      top.push({ t: type(o), start: o + 8, end: o + size });
      o += size;
    }
    var moov = null;
    for (var i = 0; i < top.length; i++) if (top[i].t === 'moov') moov = top[i];
    if (!moov) return 0;
    var count = 0;
    (function scan(c) {
      var p = c.start;
      while (p + 8 <= c.end) {
        var size = u32(p);
        if (size < 8) break;
        var t = type(p);
        if (t === 'stsz') {
          var n = u32(p + 20); // version/flags(4) + sample_size(4) + sample_count(4)
          if (n > count) count = n;
        } else if (t === 'trak' || t === 'mdia' || t === 'minf' || t === 'stbl' || t === 'moov') {
          scan({ start: p + 8, end: p + size });
        }
        p += size;
      }
    })(moov);
    return count;
  }

  // 支持 ?vids=1,3,5 只跑指定视频（1-based 索引），默认全部
  var LIST = VIDEOS;
  try {
    var qv = new URLSearchParams(location.search).get('vids');
    if (qv) {
      var idxs = qv.split(',').map(function (s) { return parseInt(s, 10); }).filter(function (n) { return n >= 1 && n <= VIDEOS.length; });
      if (idxs.length) LIST = idxs.map(function (n) { return VIDEOS[n - 1]; });
    }
  } catch (e) {}

  var idx = 0;
  function next() {
    if (idx >= LIST.length) { console.log('ALL DONE'); return; }
    var name = LIST[idx];
    idx++;
    var rel = 'test video/' + encodeURIComponent(name);
    fetch(rel).then(function (r) { return r.blob(); }).then(function (blob) {
      var url = URL.createObjectURL(blob);
      var v = document.createElement('video');
      v.muted = true; v.playsInline = true; v.preload = 'auto';
      v.onloadedmetadata = function () {
        var dur = v.duration || 0;
        fetch(rel).then(function (r) { return r.arrayBuffer(); }).then(function (ab) {
          var frames = parseFrames(ab);
          var fps = (frames && dur > 0) ? frames / dur : 30;
          var sam = 1;
          try { sam = Math.max(1, parseInt(new URLSearchParams(location.search).get('sam') || '1', 10) || 1); } catch (e) {}
          var task = P.analyze({
            video: v,
            fps: fps,
            sampleEvery: sam,
            clipStart: 0,
            clipEnd: dur,
            activity: 'approach-jump',
            onPhase: function (ph) { console.log(name + ' [' + ph + ']'); },
            onProgress: function (i, total) { if (i % 40 === 0) console.log(name + ' ' + Math.round(i / total * 100) + '%'); }
          });
          task.promise.then(function (res) {
            var light = /[?&]light=1/.test(location.search);
            var out = {
              video: name,
              fps: Math.round(fps * 1000) / 1000,
              duration: Math.round(dur * 1000) / 1000,
              frames: frames,
              poseData: light ? [] : (res.data || []),
              metrics: null,
              aborted: !!res.aborted,
              abortedReason: res.abortedReason || null,
              error: res.error ? String((res.error && res.error.message) || res.error) : null
            };
            if (res.data && res.data.length && !res.error && !res.aborted) {
              try { out.metrics = P.computeJumpMetrics(res.data, { fps: fps }); } catch (e) { out.metricsError = String(e); }
            }
            post('fx_' + idx + '.json', out).then(function () { setTimeout(next, 400); });
          });
        });
      };
      v.onerror = function () {
        post('fx_' + idx + '.json', { video: name, error: 'video load fail' }).then(function () { setTimeout(next, 300); });
      };
      v.src = url;
      v.load();
    });
  }
  next();
})();
</script>
</body>
</html>
